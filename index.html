<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFG Orbit Simulator</title>
<style>
:root{--bd:#d0d4d9;--bg2:#f5f6f8;--tx:#1a1a1a;--mu:#5b6470;--acc:#1f4e9c;--err:#b3261e;--warn:#8a5a00}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:#fff}
button,select,input{font:inherit;color:inherit}
button{background:#fff;border:1px solid #9aa3ae;border-radius:5px;padding:5px 10px;cursor:pointer;min-height:32px}
button:hover{background:#eef1f5}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;min-width:72px}
button.primary:hover{background:#173d7c}
button.primary:disabled{background:#8da3c8;border-color:#8da3c8}
:focus-visible{outline:2px solid #0b57d0;outline-offset:1px}
select{border:1px solid #9aa3ae;border-radius:5px;padding:4px 6px;min-height:32px;background:#fff;max-width:100%}
label{cursor:default}
#top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--bd)}
.brand{font-weight:700;font-size:15px}.ver{font-weight:400;color:var(--mu);font-size:12px;margin-left:6px}
.spacer{flex:1}
.hl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid var(--bd);background:#f3f4f6;white-space:nowrap}
.chip-run{background:#e6eefb;border-color:#9db8e6;color:#173d7c}.chip-done{background:#eef2f6;color:#1f2937}.chip-warn{background:#fff3d6;border-color:#e0b64f;color:var(--warn)}.chip-bad{background:#fde7e5;border-color:#e39a95;color:var(--err)}
.menu{position:relative;display:inline-flex;align-items:center;align-self:center;margin:0}.menu summary::-webkit-details-marker{display:none}.menu summary{list-style:none;box-sizing:border-box;line-height:1.2;cursor:pointer;border:1px solid #9aa3ae;border-radius:5px;padding:5px 12px;min-height:32px;display:flex;align-items:center}
.menubody{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--bd);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:30}
#app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.5fr) minmax(0,1.5fr);height:calc(100vh - 49px)}
#left,#right,#center{overflow:auto;min-height:0}
#left{background:var(--bg2);border-right:1px solid var(--bd);padding:8px 10px}
#right{background:var(--bg2);border-left:1px solid var(--bd);padding:8px 12px}
#center{padding:8px 12px}
details{margin:0 0 8px;border:1px solid var(--bd);border-radius:6px;background:#fff}
#left details>summary,#results>summary{cursor:pointer;font-weight:600;padding:7px 10px;list-style:none;min-height:34px;display:flex;align-items:center}
#left details>summary::before,#results>summary::before{content:"\25B8";margin-right:6px;color:var(--mu)}
#left details[open]>summary::before,#results[open]>summary::before{content:"\25BE"}
#left details>*:not(summary){margin-left:6px;margin-right:6px}
#left details{padding-bottom:6px}
.presetrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.field{margin:6px 0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.3fr) minmax(0,.65fr);column-gap:6px;align-items:center}
.field label{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inrow{display:contents}
.inrow input[type=text]{grid-column:2;min-width:0;width:100%}
.inrow select{grid-column:2 / -1;min-width:0;width:100%}
.inrow .unit{grid-column:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .err,.field .hint,.field .radios{grid-column:1 / -1}
#left .field input[type=text]{padding:5px 4px;font-size:12.5px}
#left .field .unit{font-size:11.5px}
.field.sel .inrow select{grid-column:2 / -1}
#left{container-type:inline-size}
@container (max-width:345px){.field{grid-template-columns:minmax(0,1fr) 74px}.field label{grid-column:1 / -1;margin-bottom:2px}.inrow input[type=text]{grid-column:1}.inrow select{grid-column:1 / -1}.inrow .unit{grid-column:2}}
input[type=text]{border:1px solid #b3ab7a;border-radius:5px;padding:5px 7px;min-height:32px;background:#fdfbe9;font-variant-numeric:tabular-nums}
input[type=text]:disabled{background:#eceef1;color:#59626e;border-style:dashed}
.field.derived input{background:#eceef1;color:#59626e;border-style:dashed}
.field.bad input{border-color:var(--err);background:#fff5f4}
.unit{font-size:12px;color:var(--mu);min-width:34px}
.err{color:var(--err);font-size:12px;min-height:0}.err:empty{display:none}
.hint{color:var(--mu);font-size:12px}
.field.ro{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:baseline;margin:3px 0;padding:3px 6px;background:#eef0f3;border-radius:4px}
.rlabel{font-size:12.5px}.rval{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.rohead{font-size:12px;font-weight:600;color:var(--mu);margin:8px 0 2px}
.radios{display:flex;flex-direction:column;gap:3px;font-size:13px}
#toolbar,#toolbar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
#toolbar2 label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--bd)}
#lawStrip{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:16px}
.lawbox{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid #9db8e6;background:#f2f6fd;border-radius:6px;min-width:0}
.lawrun{flex:1 1 auto;border-color:#d49a00;background:#fffaf0}
#lawNewton{font-family:"Cambria Math","STIX Two Math",Cambria,"Times New Roman",serif;font-size:16px;white-space:nowrap}
.lawk{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.lawn{font-size:12px;color:var(--mu)}
#lawLine{font-family:"Cambria Math","STIX Two Math",Cambria,"Times New Roman",serif;font-size:16px;white-space:nowrap}
#canvasWrap{position:relative;width:100%;height:clamp(380px,60vh,760px);border:1px solid var(--bd);border-radius:6px;background:#fff;overflow:hidden}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#banner{position:absolute;left:10px;bottom:34px;max-width:calc(100% - 280px);background:rgba(255,248,230,.96);border:1px solid #e0b64f;color:#5c3d00;padding:6px 10px;border-radius:6px;font-size:12.5px}
#live{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;margin:8px 0}
.cell{display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--bd);border-radius:5px;padding:3px 7px;min-width:0}
.cell .k{font-size:11px;color:var(--mu)}.cell .v{font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.cell .u{font-size:11px;color:var(--mu)}
#results{margin-top:6px}
#resWrap{display:block;padding:6px 12px 12px}
#resBody{min-width:0;overflow-x:auto}
.hl select{min-width:0;max-width:100%}
#magBox{position:absolute;right:8px;bottom:8px;width:min(250px,48%);background:rgba(255,255,255,.94);border:1px solid var(--bd);border-radius:6px;padding:4px;z-index:5}
#cv2{width:100%;height:200px;border:0;background:#fff;display:block}
.magctl{font-size:12px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table.rt{border-collapse:collapse;width:100%;margin:6px 0;font-size:13px}
table.rt th,table.rt td{border-bottom:1px solid #e3e6ea;padding:4px 6px;text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
table.rt th{background:var(--bg2);font-weight:600}
table.small{font-size:12px}.nt{color:var(--mu);font-size:12px}
.tscroll{max-height:260px;overflow:auto}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.warn{color:var(--warn);font-size:13px}
#results h4{margin:12px 0 2px;font-size:13px}
#right h3{margin:4px 0 6px;font-size:14px}
#right h4{margin:12px 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
#right p,#right li{font-size:13px;margin:3px 0}#right ul{padding-left:18px;margin:3px 0}
.gscroll{max-height:42vh;overflow:auto;border:1px solid var(--bd);border-radius:6px;background:#fff}
.gtab{border-collapse:collapse;width:100%;font-size:12.5px}
.gtab td{padding:4px 6px;border-bottom:1px solid #eceef1;vertical-align:top}
.gtab .ghead td{background:var(--bg2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.gsym{font-family:"Cambria Math","STIX Two Math",Cambria,"Times New Roman",serif;font-size:15px;white-space:nowrap}.gunit{color:var(--mu);white-space:nowrap}
.mname{font-weight:700}.mstat{font-size:12.5px;color:var(--mu);margin:2px 0 4px}
.eqrow{margin:4px 0;padding:4px 6px;background:#fff;border:1px solid var(--bd);border-radius:5px}
.eql{display:block;font-size:11px;color:var(--mu)}.eq{font-family:"Cambria Math","STIX Two Math",Cambria,"Times New Roman",serif;font-size:15.5px}
.tag{font-size:11px;padding:0 6px;border-radius:8px;border:1px solid var(--bd);background:#fff}
.tag-derived{border-color:#7aa2d6}.tag-empirical{border-color:#7fbf99}.tag-exploratory{border-color:#e0b64f}
#help{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
#helpBody{background:#fff;max-width:860px;width:100%;border-radius:8px;padding:8px 22px 20px;font-size:13.5px}
#helpBody h3{margin:14px 0 4px}#helpBody li{margin:3px 0}
code{background:#eef0f3;padding:0 4px;border-radius:3px}
@media (max-width:1100px){
  #app{display:block;height:auto}
  #left,#right,#center{overflow:visible}
  #left{border-right:0;border-bottom:1px solid var(--bd)}#right{border-left:0;border-top:1px solid var(--bd)}
  
  #top .hl{flex:1 1 100%;min-width:0;white-space:normal}#top .hl select{flex:1 1 0;min-width:0;width:100%;text-overflow:ellipsis}
  #toolbar .hl{flex:1 1 100%;min-width:0;white-space:normal}#toolbar .hl select{flex:1 1 0;min-width:0;width:100%}
  #lawStrip{overflow-x:auto}
  button,select,input[type=text]{min-height:42px}
  #canvasWrap{height:min(70vh,520px)}
  .gscroll{max-height:none}
  #top{gap:6px}
  #banner{max-width:calc(100% - 280px)}
}
@media (max-width:700px){#lawLine{font-size:15px;white-space:normal}.brand .ver{display:none}}

.note{font-size:12px;color:var(--mu);margin:4px 0 6px}
.livehead{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--acc);margin:8px 0 2px}
#right table.rt td{padding:3px 5px;font-size:12.5px}

#viewCtl{position:absolute;top:8px;right:250px;display:flex;gap:6px;z-index:5}

#shapeCmp{margin:0 0 12px;padding:8px 10px;background:#fff;border:1px solid #7d8da6;border-radius:6px}
#shapeCmp h3{margin:0 0 6px;font-size:14px}
.cmpeq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:5px 0;padding:6px 8px;background:#f6f8fb;border:1px solid var(--bd);border-radius:5px}
.cmpl{min-width:52px;font-weight:700;font-size:13px}
.cmpeq .eq{font-size:20px;display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid #222;padding:0 3px 1px}.fr>span:last-child{padding:1px 3px 0}
mark.gr{background:#ffe08a;color:#111;border-radius:4px;padding:1px 5px;box-shadow:0 0 0 1.5px #d49a00 inset}
.tag{font-size:11px;font-weight:700;color:#8a5a00;background:#fff3cf;border:1px solid #d49a00;border-radius:10px;padding:1px 8px}
#shapeCmp table.gtab{margin-top:4px}
#shapeCmp .selmodel{margin-top:8px;padding-top:6px;border-top:1px dashed var(--bd)}
.field label:has(input){white-space:normal;overflow:visible;grid-column:1 / -1}
i.cand{font-size:15px;color:#6b7280}
/* ---- Custom derive popup ---- */
.cdbtn{margin-left:8px;font-size:12px;padding:2px 8px}
.cmpcap{margin-top:2px}
.cdm{position:fixed;inset:0;z-index:50;pointer-events:none}
.cdm.pinned{z-index:1000}
.cdm.behind{z-index:-1}
.cdhead button.on{background:#dbe8ff;border-color:#5b8def;font-weight:700}
.cdm[hidden]{display:none}
.cdbox{pointer-events:auto;position:absolute;left:max(8px,calc((100vw - min(1180px,96vw))/2));top:56px;background:#fff;width:min(1180px,96vw);height:min(880px,calc(100vh - 64px));min-width:760px;max-width:min(1400px,98vw);min-height:min(880px,calc(100vh - 64px));max-height:calc(100vh - 8px);resize:both;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:13px}
.cdhead{cursor:move;user-select:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--bg2);flex-wrap:wrap}
.cdhead .sp{flex:1}
.cdhead select{max-width:300px}
.cdbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);min-height:0}
.cdcol{overflow:auto;padding:8px 14px 16px}
.cdL{border-right:1px solid var(--bd)}
.cdbox h5{margin:14px 0 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:#374151}
.cdbox h5 .hint,.cdbox .hint{font-weight:400;text-transform:none;letter-spacing:0;color:#6b7280;font-size:12px}
.cdf{display:flex;flex-direction:column;gap:2px;margin:6px 0;font-size:12px;color:#374151}
.cdf input[type=text],.cdf textarea,.cdf select,.cdsym input,.cdsym select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid #b9c0ca;border-radius:3px;background:#fffdf5;min-width:0;width:100%;box-sizing:border-box}
.cdf.cdchk{flex-direction:row;align-items:center;gap:6px}
.cdlaw{width:100%;box-sizing:border-box;font:15px ui-monospace,Menlo,Consolas,monospace;padding:6px;border:1px solid #8a95a5;border-radius:3px;background:#fffdf5}
.cdtype{margin:6px 0;padding:8px 10px;border:1px solid var(--bd);border-radius:3px;font-size:17px;background:#fafbfc;overflow-x:auto}
.cdread>div{margin:2px 0;font-size:12.5px}
.cdok{color:#17663a}.cdbad{color:#b00020}.cdwarn{color:#8a5a00}
#cdPal .cdpg{margin:3px 0;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.cdph{font-size:11px;color:#6b7280;width:100%}
.mysyms{display:contents}
.chip2{font:13px ui-monospace,Menlo,Consolas,monospace;padding:3px 8px;border:1px solid #b9c0ca;border-radius:4px;background:#f3f5f8;cursor:pointer;min-width:30px}
.chip2:hover{background:#e3ecfb;border-color:#5b8def}
.chip2.my{background:#eef7ee}
.cdref{margin-top:6px;padding:8px;border:1px solid var(--bd);border-radius:3px;background:#fafbfc}
.eq.big{font-size:18px;margin:6px 0}
.tag2{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;border:1px solid #9aa3b0;background:#eef1f5}
.tag2.ex{background:#e6f4ea;border-color:#2e8b57;color:#17663a}
.tag2.sh{background:#fff3cf;border-color:#d49a00;color:#8a5a00}
.cdsym{border:1px solid var(--bd);border-radius:4px;padding:6px 8px;margin:6px 0;background:#fcfcfd}
.cdsym.cdk-state{background:#fff6f6;border-color:#d99}
.cdsh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.cdsg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px}
.cdsg label{display:flex;flex-direction:column;font-size:11.5px;color:#4b5563;gap:1px}
.cdsg label.w2{grid-column:1 / -1}
.cdfh{display:grid;grid-template-columns:110px 1fr;gap:4px;margin-top:3px}
.mini{font-size:11.5px;padding:1px 7px;margin-top:4px}
.cdrow{display:flex;gap:6px;margin:6px 0;align-items:center;flex-wrap:wrap}
.cdact{margin-top:14px;padding-top:8px;border-top:1px solid var(--bd)}
.cdact .pri{font-weight:700}
.cdshape .eq{font-size:17px;margin:4px 0}
.cb{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;border:1px solid}
.cb-ok{background:#e6f4ea;color:#17663a;border-color:#2e8b57}
.cb-bad{background:#fde8ea;color:#b00020;border-color:#b00020}
.cb-uns{background:#fff3cf;color:#8a5a00;border-color:#d49a00}
.cb-nr{background:#eef1f5;color:#4b5563;border-color:#9aa3b0}
table.chk td.cd{color:#4b5563;font-size:12px}
.livehead{font-size:11.5px;font-weight:700;color:#374151;margin:6px 0 2px}


.cdbox textarea{resize:vertical;display:block;width:100%;box-sizing:border-box;line-height:1.35;padding:4px 6px;min-height:calc(var(--rows,2) * 1.35em + 8px);overflow:auto}
.cdbox .cdf{min-width:0}
.cdbox .cdf input[type=text],.cdbox .cdf textarea,.cdbox .cdf select{width:100%;max-width:100%;box-sizing:border-box}

.folderbar{margin-top:6px;padding-top:6px;border-top:1px dashed var(--bd);font-size:12px}
.folderbar .cdbtn{margin-left:6px}

/* ---- layout revision: header, model row, strip ---- */
#top .hmodel{font-size:14px}#top .hmodel b{font-weight:600;max-width:36vw;overflow:hidden;text-overflow:ellipsis}
.lawcell{display:flex;align-items:stretch;gap:6px;min-width:0}
.lawcell.lawgrow{flex:1 1 360px}.lawcell.lawgrow .lawbox{flex:1 1 auto}
.stripbtn{align-self:center;white-space:nowrap}

.bodyhead{display:flex;align-items:center;justify-content:space-between;gap:8px}

.pickmenu{position:fixed;z-index:60;background:#fff;border:1px solid var(--bd);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:4px;min-width:260px;max-width:420px;max-height:60vh;overflow:auto}

/* ---------- library (browser storage) + registry sync ---------- */

function commit(pkg) {   // append-only: a changed definition becomes a NEW immutable revision; an identical one is a no-op
  const p = JSON.parse(JSON.stringify(pkg)); if (!p.familyId) p.familyId = F.newFamilyId();

  const rev = F.revisionOf(pkg); if (MODELS['custom:' + rev]) return 'custom:' + rev;

  if (v.centre === 'sun' || (v.centre === 'bary' && !$('bary_opt').disabled)) { V.centre = v.centre; $('viewCentre').value = v.centre; }
  const f = v.flags || {};
  [['chkVel', 'vel'], ['chkAcc', 'acc'], ['chkBary', 'bary'], ['chkMark', 'markers'], ['chkPeri', 'peri'], ['chkGhost', 'ghost'], ['chkOver', 'overlay']].forEach(a => { if (typeof f[a[1]] === 'boolean') { V[a[1]] = f[a[1]]; $(a[0]).checked = f[a[1]]; } });
  if (typeof f.exag === 'boolean') { $('chkExag').checked = f.exag; $('chkExag').dispatchEvent(new Event('change')); }
  if (typeof f.magBox === 'boolean') { $('chkMagBox').checked = f.magBox; $('magBox').style.display = f.magBox ? '' : 'none'; }

  else if (v.zoom && v.zoom.auto) { V.auto = true; }
  refreshFields(); needDraw = true; resultsDirty = true;

function importConfigText(text) {

      if (obj.model.revision && obj.model.revision !== rev) extra.push('The embedded model definition does not match its declared revision (' + obj.model.revision + '); using the content revision ' + rev + '.');
      obj.model.id = LFGM.ensureFromDefinition(obj.model.definition); buildModelSelect();
    }
    const req = obj && obj.model && obj.model.bundleRevision ? obj.model.bundleRevision : null;
    if (!obj || !obj.model || !MODELS[obj.model.id] || !MODELS[obj.model.id].available)
      throw new Error('MODEL UNAVAILABLE: this configuration needs model “' + (obj && obj.model ? obj.model.id : '?') + '”' + (req ? ' (bundle revision ' + req + ')' : '') + ', which is not available here. Nothing was substituted and nothing was loaded.');

    if (!req) imp = { requested: null, actual: ini.bundleRevision, status: 'legacy-provenance (the file carries no bundle revision; none is assumed)' };

  }
  catch (e) { alert('Import failed: ' + e.message); }
