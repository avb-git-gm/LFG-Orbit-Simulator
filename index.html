olid #AEBCC9;border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff}\npre{background:#0f172a;color:#e5e7eb;padding:10px 12px;border-radius:6px;overflow:auto;line-height:1.4}\ntable{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}\nth,td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}\nth{background:#f1f4f7}\n.note{border-left:4px solid var(--acc);background:#eef4fc;padding:8px 12px;border-radius:4px;margin:10px 0}\n.warn{border-left:4px solid var(--warmbd);background:var(--warm);padding:8px 12px;border-radius:4px;margin:10px 0}\n.rule{border-left:4px solid var(--cu);background:#fbf3f3;padding:8px 12px;border-radius:4px;margin:10px 0}\n.sw{display:inline-block;min-width:110px;padding:2px 8px;border-radius:4px;border:1px solid}\n.sw.blue{background:var(--blue);border-color:var(--bluebd)}.sw.warm{background:var(--warm);border-color:var(--warmbd)}\n.sw.cust{background:var(--warm);border-color:var(--warmbd);color:var(--cu)}\n.sw.lock{background:var(--lk) repeating-linear-gradient(135deg,transparent 0 5px,rgba(0,0,0,.05) 5px 6px);border-color:#8f98a5;color:#4b5563}\n.sw.run{background:var(--acc);color:#fff;border-color:var(--acc)}.sw.teal{background:#2F7275;color:#fff;border-color:#2F7275}\n.sw.btn{background:#EAF1F7;border-color:#9FB2C4;color:#243444}.sw.wbtn{background:#fff;border-color:#AEBCC9;color:#263746}\n.sw.ready{background:#EAF6EE;border-color:#9BC7A7;color:#2E6840}\n.ok{color:var(--ok);font-weight:600}.unsup{color:var(--uns);font-weight:600}.bad{color:var(--bad);font-weight:600}\n.qa dt{font-weight:600;margin-top:10px}.qa dd{margin:2px 0 6px 0}\nol li,ul li{margin:3px 0}\n.steps li{margin:5px 0}\n#nores{display:none;padding:20px;color:var(--mu)}\n@media (max-width:900px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--bd)}main{padding:10px 14px 60px}header input{min-width:0;width:100%}}\n@media print{header,nav{display:none}.wrap{display:block}section{break-inside:avoid-page;border:0}}\n<\/style><\/head><body>\n<header><h1>LFG Orbit Simulator Help<\/h1><span class=\"ver\">]LINEAR-FIELD[ GRAVITY · simulator v1.1.8 · Sun–Mercury orbit integrator and formula tool<\/span>\n<input id=\"q\" type=\"search\" placeholder=\"Search this help (e.g. preset, lock, rtol, CSV)…\" aria-label=\"Search this help\"><\/header>\n<div class=\"wrap\">\n<nav id=\"toc\">\n<a href=\"#start\">1. Quick start<\/a>\n<a href=\"#screen\">2. The screen<\/a>\n<a class=\"n2\" href=\"#topbar\">Top bar<\/a><a class=\"n2\" href=\"#left\">Left frame<\/a><a class=\"n2\" href=\"#centre\">Centre<\/a><a class=\"n2\" href=\"#right\">Right frame<\/a>\n<a href=\"#running\">3. Running a simulation<\/a>\n<a href=\"#results\">4. Reading the results<\/a>\n<a href=\"#models\">5. Models<\/a>\n<a href=\"#build\">6. Initial, Custom, colours and locks<\/a>\n<a href=\"#presets\">7. Presets<\/a>\n<a href=\"#formulas\">8. Formulas and the formula tool<\/a>\n<a href=\"#bundles\">9. Model bundles<\/a>\n<a href=\"#configs\">10. Run configurations<\/a>\n<a href=\"#outputs\">11. Run outputs (audit CSV)<\/a>\n<a href=\"#folders\">12. Folders, files and naming<\/a>\n<a href=\"#numerics\">13. Numerical settings<\/a>\n<a href=\"#physics\">14. Physics conventions<\/a>\n<a href=\"#integrity\">15. Scientific integrity rules<\/a>\n<a href=\"#faq\">16. Troubleshooting and FAQ<\/a>\n<a href=\"#glossary\">17. Glossary<\/a>\n<a href=\"#constants\">18. Constants and sources<\/a>\n<a href=\"#version\">19. Version and validation<\/a>\n<\/nav>\n<main>\n<div id=\"nores\">No section matches your search.<\/div>\n\n<section id=\"start\"><h2>1. Quick start<\/h2>\n<p>The simulator integrates the orbit of a small body (Mercury by default) around a central mass (the Sun) under a chosen gravity law, and measures the perihelion advance from the computed trajectory. Nothing is fitted: the law drives the orbit and the advance is measured afterwards.<\/p>\n<ol class=\"steps\">\n<li>Open <code>LFG_Orbit_Simulator.html<\/code> in Chrome or Edge. It works offline; no installation.<\/li>\n<li>Choose a model in the <b>Model<\/b> dropdown (centre, under the formula boxes): Newtonian, GR reference, or an LFG trial.<\/li>\n<li>Press <span class=\"sw run\">Run<\/span> (or <kbd>Space<\/kbd>). The orbit is drawn; the run stops after the set run length (default: 5 radial cycles).<\/li>\n<li>Read the measured perihelion advance in <b>Results and measurements<\/b> (below the orbit view).<\/li>\n<li>To compare two models on the same start state: run one, press <b>Set baseline<\/b>, choose the other model, run again. The baseline is overlaid and compared.<\/li>\n<\/ol>\n<div class=\"note\">Optional but recommended: press <b>Link folder…<\/b> (right frame, \"Custom (LFG)\" box) once and select the <code>04_Orbital_Derivation<\/code> folder. The simulator then lists your Models, Presets, Formulas, Configurations and Test Sets and writes saved files and audit CSVs into the right sub-folders. Without the link everything still works through file pickers and downloads.<\/div>\n<\/section>\n\n<section id=\"screen\"><h2>2. The screen<\/h2>\n<p>The window has a top bar and three frames: left (inputs), centre (formulas, model, orbit view, results) and right (explanation, glossary, selected model).<\/p>\n<h3 id=\"topbar\">Top bar<\/h3>\n<table><tr><th>Element<\/th><th>What it shows or does<\/th><\/tr>\n<tr><td><b>Model:<\/b> chip<\/td><td>Name of the selected model. Normal text = the setup equals the model's Initial bundle; muted red text = something differs (see section 6).<\/td><\/tr>\n<tr><td><b>Build:<\/b> chip<\/td><td><code>Initial<\/code>, or <code>Custom (Preset | Formula | Parameters | Constants)<\/code> naming what differs from the model's Initial bundle.<\/td><\/tr>\n<tr><td><b>Reset Model<\/b><\/td><td>Restores the model's Initial formula, parameters and Initial preset and clears the current run. Never touches files, exports or audit records.<\/td><\/tr>\n<tr><td><b>Status:<\/b> chip<\/td><td><span class=\"sw ready\">Ready to Run<\/span> when nothing blocks a run; otherwise Running, Paused, Done, Inputs changed – restart needed, Invalid input, Preset loaded, and so on.<\/td><\/tr>\n<tr><td><span class=\"sw teal\">Manage<\/span><\/td><td>Export configuration (JSON), Import configuration…, Export trajectory (CSV), Export events and results (CSV), Run Campaign…, Open Campaign Report….<\/td><\/tr>\n<tr><td><span class=\"sw wbtn\">Help<\/span><\/td><td>Opens this page in a new browser tab.<\/td><\/tr><\/table>\n<h3 id=\"left\">Left frame (inputs)<\/h3>\n<table><tr><th>Section<\/th><th>Contents<\/th><\/tr>\n<tr><td>Preset line<\/td><td>Name of the loaded preset (scenario) and <b>Load Preset<\/b>.<\/td><\/tr>\n<tr><td>1 · Bodies<\/td><td>Central mass and orbiting mass (permanently locked against typing; a preset may set them). <b>Reset<\/b> returns every left-frame input to the loaded preset. <b>Save preset<\/b> writes the current inputs as a preset file.<\/td><\/tr>\n<tr><td>2 · Orbit and start position<\/td><td>Semi-major axis a, eccentricity e, start point (perihelion, aphelion or custom angle f), direction of motion, perihelion clock angle. These only generate the start state.<\/td><\/tr>\n<tr><td>3 · Run length<\/td><td>Continuous, 5 / 10 / 50 radial cycles, or custom (cycles or physical days).<\/td><\/tr>\n<tr><td>4 · Model parameters<\/td><td>The adjustable constants of the selected model (for example η of the LFG Expansion-Field model). Empty for Newtonian and GR.<\/td><\/tr>\n<tr><td>5 · Constants<\/td><td>G and c. Permanently locked.<\/td><\/tr>\n<tr><td>Calculated values<\/td><td>Read-only Kepler quantities of the start state (μ, period, perihelion and aphelion distance and speed, energy, angular momentum).<\/td><\/tr>\n<tr><td>Advanced initial state and numerics<\/td><td>Which start-state representation is authoritative (Kepler, polar, Cartesian), the polar and Cartesian values, integrator tolerances, marker interval, speed colour scale.<\/td><\/tr><\/table>\n<h3 id=\"centre\">Centre frame<\/h3>\n<table><tr><th>Element<\/th><th>What it does<\/th><\/tr>\n<tr><td>Step +1 d · Next perihelion · Calculate to end · Speed · Timing · View options<\/td><td>Playback controls and display options (section 3).<\/td><\/tr>\n<tr><td>Newtonian baseline box<\/td><td>The Newtonian law, always shown for reference. <b>Set baseline<\/b> keeps the current run on screen as the comparison baseline.<\/td><\/tr>\n<tr><td>Selected formula box<\/td><td>The executable law of the selected model. <b>Load Formula<\/b> opens a formula file or the formula tool. Its colour is the model colour (blue for Newtonian, warm yellow otherwise).<\/td><\/tr>\n<tr><td>Model · Load Model · Distance · Reset · Run<\/td><td>Model choice, loading a model bundle, km/AU display, clearing the run, starting/pausing the run. A <b>Save<\/b> button appears next to Load Model when a custom model is selected.<\/td><\/tr>\n<tr><td>Orbit view<\/td><td>The computed trajectory. Fit, +, − zoom; the lock icon next to them controls wheel zoom (section 3). The dotted vertical line is the 0° reference axis (12 o'clock).<\/td><\/tr>\n<tr><td>Scaled-angle panel<\/td><td>Perihelion directions with the angular differences magnified by the stated factor. Display only; it is not geometry.<\/td><\/tr>\n<tr><td>Live strip and Results<\/td><td>Current time, cycle, distance, speed and advances; below, the measurement tables (section 4).<\/td><\/tr><\/table>\n<h3 id=\"right\">Right frame<\/h3>\n<p>Orbital-shape equations (Newton and GR, explanation only), the custom-model box with <b>Custom derive…<\/b> (formula tool) and <b>Link folder…<\/b>, the glossary of every symbol, and the selected model's engine equation, expected precession and checks. The shape equations are never integrated; the engine integrates the motion law shown in the Selected formula box.<\/p>\n<\/section>\n\n<section id=\"running\"><h2>3. Running a simulation<\/h2>\n<table><tr><th>Control<\/th><th>Effect<\/th><\/tr>\n<tr><td><span class=\"sw run\">Run<\/span> / <kbd>Space<\/kbd><\/td><td>Starts or pauses. The trajectory is computed once from the inputs at the moment of starting; editing inputs afterwards marks the run \"Inputs changed – restart needed\" and never alters the running trajectory.<\/td><\/tr>\n<tr><td>Reset (centre)<\/td><td>Clears the run and returns to the start.<\/td><\/tr>\n<tr><td>Step +1 d<\/td><td>Advances one marker interval (1 day by default).<\/td><\/tr>\n<tr><td>Next perihelion<\/td><td>Plays until the next perihelion.<\/td><\/tr>\n<tr><td>Calculate to end<\/td><td>Computes the whole run immediately without animation. Use it for measurements.<\/td><\/tr>\n<tr><td>Speed<\/td><td>Seconds of animation per reference orbit, or custom days per second. Changes only how fast the picture moves; the computed orbit is identical at every speed.<\/td><\/tr>\n<tr><td>Timing<\/td><td>Fixed physical time (reference = initial Kepler period) or period-normalized (reference = measured radial period). The reference is frozen until Reset.<\/td><\/tr>\n<tr><td>View: Sun-centred / Barycentric<\/td><td>Frame used for drawing. Barycentric is available for models with reciprocal treatment.<\/td><\/tr>\n<tr><td>Tick boxes<\/td><td>daily markers, perihelion lines, last-pass radius, velocity arrow, acceleration arrow, barycentre, baseline overlay, exaggerate non-closure (display only), scaled-angle panel.<\/td><\/tr><\/table>\n<h3>Run length<\/h3>\n<ul><li><b>Radial cycles N<\/b>: the run ends at the (N+1)-th perihelion, counting a perihelion at the start as the first. 5 cycles therefore give 5 measured advances.<\/li>\n<li><b>Physical days<\/b>: the run ends after that time.<\/li>\n<li><b>Continuous<\/b>: computes just ahead of playback until you pause or reset (ceiling 2000 radial cycles).<\/li><\/ul>\n<h3>Layout of the orbit view<\/h3>\n<ul><li><b>Scientific axis<\/b>: the dotted vertical 0° axis (through the Sun) is always at the horizontal centre of the view after Fit. Its heading reads <b>0°<\/b> left of the axis and <b>12 o'clock<\/b> right of it. Text and panels never push the orbit sideways; when space is short, Fit only reduces the scale (the orbit's shape and proportions are never changed). Fit draws the orbit at 85 % of the largest size that would fit, so it sits comfortably inside the frame.<\/li>\n<li><b>Area 1 (upper left)<\/b>: model; time (or \"Preview (before Run)\"); measured perihelion shift P1 → Pn; preset name; <b>Preset orbit<\/b> with one value per row: a, e, perihelion distance rp, aphelion distance ra and run length of the scenario actually integrated. For e ≥ 0.5 a line states that the elongated ellipse is the real geometry of the preset.<\/li>\n<li><b>Preset info card<\/b> (Area 1): a preset may carry an optional info panel (section 7). While that preset's scenario is active and unchanged, its card shows the title, a, e, rp, ra, run length and the explanations. Editing a value hides the card (it would no longer describe the scenario); restoring the values shows it again. \"less ▾ / details ▸\" folds the explanations; on a narrow window the card folds automatically rather than shrinking the orbit.<\/li>\n<li><b>Area 2 (lower left)<\/b>: <b>Exaggerate non-closure<\/b> status only: ON ×N (display only) or OFF. It magnifies only the angle between successive passes; it never changes the orbit's shape or size, the calculation, the results or the exports. OFF shows the true calculated trajectory.<\/li>\n<li><b>Area 3 (bottom left)<\/b>: scale bar and the PREVIEW / \"Orbit at true scale\" note, on the same bottom margin as the <b>Scaled-angles panel<\/b> (Area 4, bottom right).<\/li>\n<li>Fit keeps every drawn point clear of Areas 1–4, the speed legend, the zoom buttons and the axis heading. On a narrow window the zoom buttons move under the speed legend so the axis heading stays free.<\/li><\/ul>\n<h3>Zoom and pan<\/h3>\n<ul><li>Drag to pan. <b>Fit<\/b> frames everything that is drawn (with \"exaggerate non-closure\" on, the rotated passes exactly as drawn) as large as the layout allows, axis centred; <b>+<\/b> and <b>−<\/b> zoom.<\/li>\n<li><b>Automatic framing<\/b> (after Fit): while a run continues and new passes extend beyond the frame, the view re-fits so all passes stay visible.<\/li>\n<li><b>Manual framing<\/b>: panning, wheel zoom, + or − switch to manual framing. The view is then never moved or rescaled automatically, also not when a new run starts. Press <b>Fit<\/b> to return to automatic framing. Loading a preset or pressing Reset re-frames the new scenario.<\/li>\n<li>Labels at the orbit (Sun, Mercury, Start, perihelion, aphelion, start velocity direction, P1…Pn, shift, same phase, barycentre, End) are placed so they do not overlap; a label moved away from its point has a thin connecting line.<\/li>\n<li>The padlock next to − is the <b>wheel-zoom lock<\/b>. Closed (default): the mouse wheel scrolls the page even over the orbit view. Open: the wheel zooms the view. <kbd>Ctrl<\/kbd> + wheel always zooms.<\/li>\n<li>Click the orbit view to run or pause.<\/li><\/ul>\n<h3>Comparing models (baseline)<\/h3>\n<ol><li>Run model A (for example Newtonian). Press <b>Set baseline<\/b>.<\/li>\n<li>Select model B. The scenario (left frame) is kept, so B starts from the identical physical state.<\/li>\n<li>Run B. The baseline orbit is overlaid (tick \"baseline overlay\") and the results show \"Raw candidate vs raw Newtonian baseline\".<\/li><\/ol>\n<p>A baseline whose configuration no longer matches (for example after Reset Model) is labelled <b>STALE<\/b>; it is kept, not deleted.<\/p>\n<\/section>\n\n<section id=\"results\"><h2>4. Reading the results<\/h2>\n<p>Nothing is measured until two perihelia exist. All values come from the computed trajectory.<\/p>\n<table><tr><th>Row<\/th><th>Meaning<\/th><\/tr>\n<tr><td>Completed radial cycles<\/td><td>Number of perihelion-to-perihelion intervals measured.<\/td><\/tr>\n<tr><td>Radial period P<sub>r<\/sub><\/td><td>Mean time between successive perihelia (± scatter).<\/td><\/tr>\n<tr><td>Azimuthal revolution time<\/td><td>Time for the unwrapped polar angle to advance 2π.<\/td><\/tr>\n<tr><td>Perihelion / aphelion radius (mean)<\/td><td>Mean of the refined event radii.<\/td><\/tr>\n<tr><td>Δω<sub>meas<\/sub> per cycle, MEASURED (mean)<\/td><td>Apsidal advance per radial cycle = (unwrapped angle between successive perihelia, along the motion) − 2π. Positive = in the direction of motion.<\/td><\/tr>\n<tr><td>Δω<sub>meas<\/sub> per Julian century<\/td><td>Mean advance per cycle × (36525 d / mean radial period). An extrapolation, labelled as such.<\/td><\/tr>\n<tr><td>Scatter / trend of advance<\/td><td>Spread and drift of the per-cycle advances; a numerical-quality indicator.<\/td><\/tr>\n<tr><td>Energy drift, angular-momentum drift<\/td><td>Relative change of the model's own conserved quantities (energy only when the model declares an energy law).<\/td><\/tr>\n<tr><td>Perihelia table<\/td><td>Time, radius, direction (° counter-clockwise from 12 o'clock), advance vs previous, cumulative advance, radial period for each perihelion.<\/td><\/tr>\n<tr><td>Δω<sub>exp<\/sub> analytic<\/td><td>The model's expected advance from its analytic formula, shown for reference only. It is never used by the engine.<\/td><\/tr>\n<tr><td>Convergence study<\/td><td>Button that re-runs the configuration at rtol × 100, × 1 and ÷ 100 and lists the same measurements, so you can see whether a result is numerical.<\/td><\/tr><\/table>\n<h3>How events are found<\/h3>\n<p>A perihelion (or aphelion) is the zero of the radial velocity r·v, refined by root finding on the integrator's own 5th-order continuous solution, not the smallest sampled radius. Newtonian runs therefore show an advance at the level of the numerical floor (about 1e-4″ per cycle or smaller for Mercury at rtol 1e-10); that floor is reported, never subtracted silently.<\/p>\n<\/section>\n\n<section id=\"models\"><h2>5. Models<\/h2>\n<table><tr><th>Group<\/th><th>Model<\/th><th>Notes<\/th><\/tr>\n<tr><td>Baseline<\/td><td>Newtonian two-body<\/td><td>−μ r/|r|³ with μ = G(M<sub>central<\/sub> + M<sub>orbiting<\/sub>). Built-in and immutable.<\/td><\/tr>\n<tr><td>Reference theories (external to LFG)<\/td><td>GR: Schwarzschild test body, first post-Newtonian<\/td><td>External comparison only. Built-in and immutable. Never used inside an LFG law.<\/td><\/tr>\n<tr><td>Validation fixtures (not physics)<\/td><td>FIXTURE: Newtonian + λ/r³<\/td><td>A test law with an exactly known answer, used to verify the measurement chain.<\/td><\/tr>\n<tr><td>LFG trials<\/td><td>Custom models (for example LFG Expansion-Field Geometric Equivalent)<\/td><td>Made with the formula tool or loaded from a model bundle. Each has a formula revision id <code>r-…<\/code>.<\/td><\/tr><\/table>\n<ul><li><b>Selecting a model keeps the current scenario<\/b> (left frame), so models are always compared on identical inputs.<\/li>\n<li>A model's own <b>Initial preset<\/b> is applied only when you press <b>Reset Model<\/b> or load the model with <b>Load Model<\/b>.<\/li>\n<li>Model parameters appear in section 4 of the left frame; their defaults belong to the model's Initial bundle.<\/li>\n<li>Built-in Newtonian and GR laws cannot be edited. To vary one, make a custom copy in the formula tool (section 8, \"Replace my law with this\").<\/li><\/ul>\n<\/section>\n\n<section id=\"build\"><h2>6. Initial, Custom, colours and locks<\/h2>\n<h3>Initial vs Custom<\/h3>\n<p>Every model has an <b>Initial bundle<\/b>: its formula, parameter values and Initial preset. The app compares the current effective values with that bundle directly (never with edit history):<\/p>\n<ul><li>All equal → <code>Build: Initial<\/code>.<\/li>\n<li>Something differs → <code>Build: Custom (…)<\/code> listing the kinds: <b>Preset<\/b> (orbit, masses, run length, numerics), <b>Formula<\/b>, <b>Parameters<\/b>, <b>Constants<\/b>.<\/li>\n<li>Restoring a value exactly returns it to Initial immediately. Display-only settings (play speed, marker interval, zoom, units, speed colour scale) never change Build.<\/li>\n<li><b>Custom<\/b> (differs from Initial) and <b>Unsaved<\/b> (differs from the loaded or saved file) are separate. A saved custom preset is still Custom.<\/li><\/ul>\n<h3>Colour language<\/h3>\n<table><tr><th>Look<\/th><th>Meaning<\/th><\/tr>\n<tr><td><span class=\"sw blue\">0.20563593<\/span><\/td><td>Editable value equal to Initial, Newtonian model selected (blue model colour).<\/td><\/tr>\n<tr><td><span class=\"sw warm\">0.20563593<\/span><\/td><td>Editable value equal to Initial, GR / LFG / custom model selected (warm model colour, same as the Selected formula box).<\/td><\/tr>\n<tr><td><span class=\"sw cust\">0.3<\/span><\/td><td>Muted red text = value differs from the model's Initial. Not an error.<\/td><\/tr>\n<tr><td><span class=\"sw lock\">1.988409871e30<\/span><\/td><td>Grey hatched = locked against typing. Locked wins over red.<\/td><\/tr>\n<tr><td><span class=\"sw run\">Run<\/span><\/td><td>The only primary action.<\/td><\/tr>\n<tr><td><span class=\"sw teal\">Manage<\/span><\/td><td>Scientific data management (export/import).<\/td><\/tr>\n<tr><td><span class=\"sw btn\">Calculate to end<\/span><\/td><td>Ordinary simulator or scientific action.<\/td><\/tr>\n<tr><td><span class=\"sw wbtn\">Help<\/span><\/td><td>Window or application control.<\/td><\/tr>\n<tr><td><span class=\"sw ready\">Ready to Run<\/span><\/td><td>Operational readiness.<\/td><\/tr>\n<tr><td><span class=\"ok\">passed<\/span> · <span class=\"unsup\">unsupported<\/span> · <span class=\"bad\">failed<\/span><\/td><td>Formula checks: green passed, amber unsupported (check not available; not a failure), red failed.<\/td><\/tr><\/table>\n<h3>Locks<\/h3>\n<table><tr><th>Kind<\/th><th>Fields<\/th><th>Look and behaviour<\/th><\/tr>\n<tr><td>Fixed (permanent)<\/td><td>Central mass, orbiting mass, G, c<\/td><td>Grey boxed padlock, not clickable. You cannot type into these fields. A preset can still set the two masses (other physical systems); G and c are never changed by a preset.<\/td><\/tr>\n<tr><td>Flexible (optional)<\/td><td>a, e, start point, start angle f, direction, perihelion clock angle, run length, polar and Cartesian start values, relative tolerance, absolute tolerance, max step, max steps, model parameters<\/td><td>Bare padlock icon: open grey outline = unlocked; closed darker grey = locked. Click to toggle. A lock only blocks typing; presets still apply. Lock state never changes Build. Your lock choices are remembered in this browser.<\/td><\/tr>\n<tr><td>None<\/td><td>Marker interval, speed colour scale, view controls<\/td><td>Display only; always editable.<\/td><\/tr>\n<tr><td>Wheel-zoom lock<\/td><td>Orbit view<\/td><td>Same bare padlock: closed = wheel scrolls the page; open = wheel zooms.<\/td><\/tr><\/table>\n<h3>The three resets<\/h3>\n<ul><li><b>Reset<\/b> (Bodies header): every left-frame input back to the loaded preset.<\/li>\n<li><b>Reset<\/b> (centre, next to Run): clears the run only.<\/li>\n<li><b>Reset Model<\/b> (top bar): Initial formula, parameters and Initial preset; clears the run.<\/li><\/ul>\n<\/section>\n\n<section id=\"presets\"><h2>7. Presets<\/h2>\n<p>A preset is a scenario: exactly the settings of the left frame (bodies, orbit, start, run length, numerics). It never contains a formula and never changes the selected model or its parameters. The preset name is the scenario name (\"Mercury baseline\", \"Non-Mercury high-eccentricity test\"), never a model name.<\/p>\n<h3>Load, change, save<\/h3>\n<ol class=\"steps\"><li><b>Load Preset<\/b> → choose the built-in Mercury baseline, an entry from the Presets folder, or <i>Browse for a preset file…<\/i>.<\/li>\n<li>The preset name appears at the top of the left frame; fields that differ from the model's Initial show red text and Build becomes <code>Custom (Preset)<\/code>. This is normal.<\/li>\n<li>Edit values if needed. <b>Save preset<\/b> turns red while there are unsaved changes; press it, give a name; the file goes to <code>Presets/<\/code> (or is downloaded).<\/li>\n<li><b>Reset<\/b> (Bodies header) returns to the loaded preset.<\/li><\/ol>\n<h3>Write a preset by hand (format 2)<\/h3>\n<p>Only the values you want to set are required besides the core orbit fields; missing masses, G, c, polar and Cartesian blocks keep the current values.<\/p>\n<pre>{\n  \"format\": \"LFG-preset\",\n  \"formatVersion\": 2,\n  \"name\": \"Example scenario 0.5 AU e=0.8\",\n  \"description\": \"Scenario only. Masses, G and c are kept from the current setup.\",\n  \"author\": \"Alexander\",\n  \"created\": \"2026-10-11T00:00:00.000Z\",\n  \"bodies\": { \"central\": \"Sun\", \"orbiting\": \"Mercury\" },\n  \"settings\": {\n    \"a\": 74798935350.0, \"e\": 0.8,\n    \"startMode\": \"perihelion\", \"fDeg\": 0, \"orientDeg\": 0, \"dir\": \"ccw\",\n    \"runMode\": \"cycles\", \"runValue\": 5,\n    \"initMode\": \"kepler\",\n    \"numerics\": { \"rtol\": 1e-12, \"atol\": 1e-12, \"hmax\": 0.05, \"maxSteps\": 2000000, \"sampleDays\": 1 },\n    \"speedScale\": { \"auto\": true, \"min\": 0, \"max\": 0 }\n  }\n}<\/pre>\n<table><tr><th>Key<\/th><th>Unit<\/th><th>Rule<\/th><\/tr>\n<tr><td><code>Msun<\/code>, <code>Mmerc<\/code><\/td><td>kg<\/td><td>Optional in format 2; > 0. Central and orbiting mass.<\/td><\/tr>\n<tr><td><code>G<\/code>, <code>c<\/code><\/td><td>SI<\/td><td>Optional; always ignored when loading a preset (constants are fixed).<\/td><\/tr>\n<tr><td><code>a<\/code><\/td><td>m<\/td><td>> 0; perihelion a(1−e) must lie outside the solar radius 6.957e8 m.<\/td><\/tr>\n<tr><td><code>e<\/code><\/td><td>–<\/td><td>0 ≤ e &lt; 1.<\/td><\/tr>\n<tr><td><code>startMode<\/code><\/td><td>–<\/td><td><code>perihelion<\/code>, <code>aphelion<\/code> or <code>custom<\/code> (then <code>fDeg<\/code> is used).<\/td><\/tr>\n<tr><td><code>fDeg<\/code>, <code>orientDeg<\/code><\/td><td>degrees<\/td><td>Start angle from perihelion; perihelion clock angle (0 = 12 o'clock, counter-clockwise).<\/td><\/tr>\n<tr><td><code>dir<\/code><\/td><td>–<\/td><td><code>ccw<\/code> or <code>cw<\/code>.<\/td><\/tr>\n<tr><td><code>runMode<\/code>, <code>runValue<\/code><\/td><td>–<\/td><td><code>cycles<\/code> (1–2000), <code>days<\/code> (≤ 2,000,000) or <code>cont<\/code> (value must still be a number).<\/td><\/tr>\n<tr><td><code>initMode<\/code><\/td><td>–<\/td><td><code>kepler<\/code>, <code>polar<\/code> (needs <code>polar<\/code>: r0, alphaDeg, vr, vt) or <code>cartesian<\/code> (needs <code>cart<\/code>: x, y, vx, vy).<\/td><\/tr>\n<tr><td><code>numerics<\/code><\/td><td>–<\/td><td>rtol 1e-14…1e-3; atol (0, 1e-3]; hmax 1e-4…0.5; maxSteps ≥ 1000; sampleDays 0.01…365 (optional).<\/td><\/tr>\n<tr><td><code>bodies<\/code><\/td><td>–<\/td><td>Labels only (≤ 24 characters). Formulas still use <code>M_Sun<\/code> and <code>M_Merc<\/code>.<\/td><\/tr><\/table>\n<h3>Optional info panel<\/h3>\n<p>A preset may include <code>infoPanel<\/code> to explain its scenario in the orbit view (for example the synthetic 0.5 AU / e = 0.8 stress test):<\/p>\n<pre>\"infoPanel\": {\n  \"title\": \"SYNTHETIC HIGH-ECCENTRICITY STRESS TEST\",\n  \"items\": [\n    { \"label\": \"Purpose\",  \"text\": \"Synthetic non-Mercury solar orbit used to compare model behaviour away from the Mercury case.\" },\n    { \"label\": \"Geometry\", \"text\": \"The elongated ellipse is the actual preset orbit geometry.\" }\n  ]\n}<\/pre>\n<ul><li>title 1–80 characters; 1–6 items, each with a label (1–40) and a text (1–400). Plain text only; other keys inside it are dropped; an invalid block is ignored with a status message and the preset still loads.<\/li>\n<li>Display only: it is never read by the physics, the model, the formula or the numerics, and it is <b>not<\/b> part of the preset identity (<code>presetRevision<\/code> covers the bodies and the scenario values only), so adding or editing it does not change the revision.<\/li>\n<li>The values on the card (a, e, rp, ra, run) are computed from the actual inputs, never typed in the panel.<\/li>\n<li><b>Save preset<\/b> keeps the loaded preset's description and info panel when the scenario is unchanged; after an edit they are not copied (they might no longer be true).<\/li><\/ul>\n<p>The app computes the preset identity <code>presetRevision<\/code> (<code>p-…<\/code>) from the content; you never need to write it.<\/p>\n<\/section>\n\n<section id=\"formulas\"><h2>8. Formulas and the formula tool<\/h2>\n<p>Open the formula tool with <b>Custom derive…<\/b> (right frame) or <b>Load Formula → Open the formula tool<\/b>. It builds a law, checks it, saves it as a revision and runs it in the simulator.<\/p>\n<h3>Window<\/h3>\n<table><tr><th>Control<\/th><th>Purpose<\/th><\/tr>\n<tr><td>Library dropdown<\/td><td>Saved formula revisions. Red text when the working copy is Customized.<\/td><\/tr>\n<tr><td>Import… / Export…<\/td><td>Read or write a formula file.<\/td><\/tr>\n<tr><td>Run checks<\/td><td>Syntax, dimensions, dependency cycles, evolving states, domain probe, Newtonian-limit recovery, angular momentum, energy, convergence, expected precession. Each reported separately: <span class=\"ok\">passed<\/span>, <span class=\"bad\">failed<\/span>, <span class=\"unsup\">unsupported<\/span>, not run.<\/td><\/tr>\n<tr><td>Use in simulator<\/td><td>Saves the revision if needed and makes it the running model.<\/td><\/tr>\n<tr><td>Clear all<\/td><td>Empties the working copy. Saved revisions are untouched.<\/td><\/tr>\n<tr><td>Fit height · Reset window · Pin on top · Close<\/td><td>Window controls only.<\/td><\/tr>\n<tr><td>Model bar: <b>Status<\/b><\/td><td><code>Initial<\/code>, <code>Customized<\/code> (red) or <code>New<\/code> (no Initial exists yet).<\/td><\/tr>\n<tr><td>Model bar: <b>Reset<\/b><\/td><td>Enabled only when Customized. Restores every field that has an Initial value. For a copy of a built-in law, only mode, law and symbols have an Initial; your name and notes are kept.<\/td><\/tr>\n<tr><td>Model bar: <b>Save As<\/b><\/td><td>Saves the working copy under a name (Formulas folder or download). Red outline while there are unsaved changes.<\/td><\/tr><\/table>\n<h3>Writing a law<\/h3>\n<ul><li>The law is the <b>total<\/b> acceleration in m s⁻². Include Newtonian gravity exactly once.<\/li>\n<li><b>Radial mode<\/b>: scalar a<sub>r<\/sub>(r), outward positive. Newton: <code>-mu/r^2<\/code>.<\/li>\n<li><b>Vector mode<\/b>: vector acceleration of r, v, t. Newton: <code>-mu*r/norm(r)^3<\/code>.<\/li>\n<li>Built-in names: <code>G M_Sun M_Merc c mu pi<\/code>; variables <code>r<\/code> (and <code>v<\/code>, <code>t<\/code> in vector mode).<\/li>\n<li>Operators <code>+ - * / ^ ( )<\/code>; multiplication must be explicit (<code>3*eta<\/code>).<\/li>\n<li>Functions: <code>sqrt abs exp ln sin cos tan atan2 min max sign<\/code>; vector: <code>norm dot cross x y perp<\/code> (2D <code>cross<\/code> returns a scalar).<\/li>\n<li>Dimensions are checked: terms that cannot be added are rejected.<\/li><\/ul>\n<h4>Example: a 1/r³ correction with a dimensionless strength<\/h4>\n<pre>law:      -mu/r^2 - k*mu*L^2/(c^2*r^4)      (radial mode)\nsymbols:  k  constant  unit 1        value 0     meaning \"correction strength\"\n          L  constant  unit m^2 s^-1 value 2.7e15 meaning \"specific angular momentum scale\"\nnewtonianLimit: { \"k\": 0 }<\/pre>\n<h3>Symbols<\/h3>\n<ul><li><b>constant<\/b>: a number (SI) with meaning, unit and origin (derived, measured, literature, hypothesis, exploratory, fitted). Constants appear as Model parameters in the simulator.<\/li>\n<li><b>calculated expression<\/b>: evaluated every step from constants, r, v, t and earlier expressions.<\/li>\n<li><b>evolving state<\/b>: can be recorded but is not executable in this version; a law using one stays a draft.<\/li><\/ul>\n<h3>Copying a built-in law<\/h3>\n<p>Reference formulas → choose Newtonian or GR → <b>Replace my law with this<\/b>. Your copy records its lineage (parent model, version, law hash). Changed terms are highlighted, new symbols are tagged NEW, removed terms are struck through. The one comment row under the rendered law states whether the law is identical to its Initial and whether there are unsaved changes.<\/p>\n<h3>From formula to runnable model<\/h3>\n<ol><li>Write the law and symbols until the tool says <b>Executable: can be simulated.<\/b><\/li>\n<li>Run checks; note the results honestly.<\/li>\n<li>Save As (Formulas folder).<\/li>\n<li>Use in simulator; set the scenario; press <b>Save<\/b> next to Load Model to write a model bundle (Models folder).<\/li><\/ol>\n<\/section>\n\n<section id=\"bundles\"><h2>9. Model bundles<\/h2>\n<p>A model bundle (<code>.lfgmodel.json<\/code>) is everything needed to select one Model entry and run: the formula package, parameter values, the Initial preset and view settings. Bundles in the Models folder appear in the Model dropdown after the folder is linked; any bundle can be opened with <b>Load Model<\/b>.<\/p>\n<table><tr><th>Identity<\/th><th>Identifies<\/th><th>Changes when<\/th><\/tr>\n<tr><td><code>r-…<\/code> formula revision<\/td><td>The physics formula<\/td><td>Law, symbols, assumptions or other package content change<\/td><\/tr>\n<tr><td><code>b-…<\/code> bundle revision<\/td><td>The complete bundle<\/td><td>Name, formula reference, parameter defaults or Initial preset change (not view settings)<\/td><\/tr>\n<tr><td><code>p-…<\/code> preset revision<\/td><td>One scenario<\/td><td>Bodies, masses, orbit, run length or numerics change<\/td><\/tr><\/table>\n<ul><li>Loading the same bundle revision again does nothing. A different revision of a known model asks before replacing.<\/li>\n<li>A file whose declared revision does not match its content is rejected (INTEGRITY ERROR).<\/li><\/ul>\n<\/section>\n\n<section id=\"configs\"><h2>10. Run configurations<\/h2>\n<p><b>Manage → Export configuration<\/b> writes the exact setup of a run (model definition, parameters, constants with sources, initial Cartesian state, run length, integrator settings) to <code>Configurations/<\/code>. <b>Manage → Import configuration…<\/b> restores it.<\/p>\n<ul><li>If the stored model has a different bundle revision, the import warns <b>MODEL REVISION MISMATCH<\/b>; you may continue, but it is never called an exact reproduction and the audit CSV records the mismatch.<\/li>\n<li>If the model is not available, nothing is substituted (MODEL UNAVAILABLE).<\/li><\/ul>\n<\/section>\n\n<section id=\"outputs\"><h2>11. Run outputs and Campaign Autopilot<\/h2>\n<p>The simulator exports single-run verification records and automated simulation campaign suites using a concise, bounded naming architecture: single runs <code>&lt;ModelCode&gt;_&lt;PresetCode&gt;_&lt;RunToken&gt;_&lt;Artifact&gt;.&lt;ext&gt;<\/code>; campaign runs add a case locator, <code>&lt;ModelCode&gt;_&lt;PresetCode&gt;_&lt;RunToken&gt;_&lt;CaseLocator&gt;_&lt;Artifact&gt;.&lt;ext&gt;<\/code> (strict ceiling of 64 characters). Saved records are never overwritten: if a single-run export name already exists in <code>Run_Outputs/<\/code> or <code>Configurations/<\/code> (compared case-insensitively, as on Windows), the new files get a <code>_R2<\/code>, <code>_R3<\/code>, … suffix.<\/p>\n<h3>Artifact codes<\/h3>\n<ul>\n<li><code>T<\/code>: Trajectory CSV (<code>_T.csv<\/code>) — one row per accepted integrator step with high-precision time, position, velocity, and radius.<\/li>\n<li><code>E<\/code>: Events and results CSV (<code>_E.csv<\/code>) — structured metadata and tables (<code>events<\/code>, <code>per_cycle<\/code>, <code>results<\/code>, <code>reference<\/code>, <code>numerical_integrity<\/code>, <code>baseline_comparison<\/code>). Split at lines <code># TABLE &lt;name&gt;<\/code>. Geometric averages use matched completed orbital cycles.<\/li>\n<li><code>C<\/code>: Configuration JSON (<code>_C.json<\/code>) — complete, reproducible run setup serialized directly from the executed integrator state.<\/li>\n<\/ul>\n<h3>Model and preset codes<\/h3>\n<ul>\n<li>Established model aliases: <code>G1P<\/code> (GR Schwarzschild 1PN), <code>L89<\/code> (LFG Expansion-Field Geometric Equivalent [11089e]), <code>NEW<\/code> (Newtonian two-body), <code>FIX<\/code> (Newtonian fixed-source). Unrecognized models receive a deterministic fallback code <code>M<\/code> + 5 hex characters.<\/li>\n<li>Established preset aliases: <code>H5E8<\/code> (Non-Mercury High-Eccentricity Test 0.5 AU / e=0.8), <code>MERC<\/code> (Mercury nominal baseline). Unrecognized presets receive a deterministic fallback code <code>P<\/code> + 5 hex characters. The preset code is a label only: campaign cases are executed from their own inline settings, and a preset revision named in a campaign is recorded as <code>DECLARED_UNVERIFIED<\/code> (the preset file is not loaded).<\/li>\n<li><code>RunToken<\/code>: Deterministic 6-character hex token derived strictly from the effective scientific and numerical configuration (excluding UI timestamps and non-effective stale fields). Full scientific provenance, model hashes, revisions, and physics formulas remain safely preserved inside internal <code>#<\/code> metadata header lines and configuration JSON.<\/li>\n<\/ul>\n<h3>Simulation Campaign Autopilot (LFGBatch)<\/h3>\n<p><b>Manage → Run Campaign…<\/b> runs a campaign: a list of fully specified cases (model, inline orbit settings, numerics, run length, required artifacts, declared acceptance criteria). Three separate states are recorded and never mixed:<\/p>\n<ul>\n<li><b>Execution<\/b> (per case and per campaign): <code>COMPLETE<\/code> only when the declared completion condition was actually reached (requested radial cycles, or requested days) with a normal stop. A step limit, time limit, collision, escape or error gives <code>INCOMPLETE<\/code>.<\/li>\n<li><b>Scientific outcome<\/b> (per case): <code>PASS<\/code>, <code>QUALIFIED<\/code>, <code>INCONCLUSIVE<\/code> or <code>FAIL<\/code> against the criteria declared in the campaign; <code>NOT_EVALUATED<\/code> when the case did not complete or did not run. A crash is never a scientific FAIL. The campaign classification is the worst evaluated outcome, and at least <code>INCONCLUSIVE<\/code> when any case was not evaluated. An acceptance target without a declared threshold (<code>advanceTolArcsec<\/code>) is recorded and not evaluated; no threshold is ever assumed.<\/li>\n<li><b>Evidence persistence<\/b>: only an exactly verified <code>COMPLETE.json<\/code> package is certified. The manifest records a SHA-256 and UTF-8 byte count for every T/E/C artifact and every required batch file except itself; <code>COMPLETE.json<\/code> binds the manifest hash and required-file count. The final verifier checks the exact path set, all hashes and byte counts, identities, and the single COMPLETE marker. Every field of <code>COMPLETE.json<\/code> is required and must equal the value derived from the hash-bound evidence and the running release; the reported execution state and scientific classification are taken from <code>manifest.json<\/code> and <code>summary.json<\/code>, never from the marker. Certification first writes <code>CERTIFICATION_PENDING.json<\/code>, writes and verifies the package, writes and verifies the marker, removes the sentinel, and only then runs the final verification. Completeness is checked against per-case artifact obligations recorded during execution (from the campaign definition) in <code>summary.json<\/code> and <code>batch_log.json<\/code>, never against the manifest's own artifact list: every declared T/E/C artifact of every executed case must be present in the manifest, the inventory, the stored files and the REPORT table, with matching embedded identity. A directory is certified only with <code>COMPLETE.json<\/code> alone: any <code>INCOMPLETE.json<\/code>, any <code>CERTIFICATION_PENDING.json<\/code>, a missing or second marker, an alternate spelling, a missing or extra file, or any mismatch is NOT CERTIFIED. A failed or interrupted certification keeps the sentinel, so it can never later verify as certified; if the sentinel or <code>COMPLETE.json<\/code> cannot be removed, a hard persistence error is returned. Existing directories are never reused or overwritten.<\/li>\n<\/ul>\n<ul>\n<li>Campaign files: <code>Test_Sets/&lt;TestSetID&gt;/testset.json<\/code> (format <code>LFG-test-set<\/code>; optional <code>phaseId<\/code>, <code>comparisons<\/code>, <code>numericalFloorArcsecPerCycle<\/code>). Preflight validation rejects unsafe or ambiguous campaigns before anything runs: unknown artifact codes, duplicate caseIds, caseIds that differ only by letter case or punctuation (their file names would collide on Windows), run modes without a completion condition, invalid inputs.<\/li>\n<li>Comparisons are computed only when listed explicitly in <code>comparisons: [{\"baseline\": caseId, \"candidate\": caseId}]<\/code> (candidate minus baseline). Nothing is inferred from case order, the number of cases or case roles; without a declared comparison the report states &ldquo;No scientific comparison declared.&rdquo; and still reports every case. A comparison carries its own <code>regressionBenchmarks<\/code> if declared; campaign-level <code>regressionBenchmarks<\/code> are reproduced verbatim as campaign-declared values and never attached to a comparison.<\/li>\n<li>Numerical floor: only a campaign-declared value or measured Newtonian control residuals (each valid for its own geometry and numerical configuration); otherwise the report states <code>UNAVAILABLE<\/code>.<\/li>\n<li>Without a linked folder the campaign runs in memory only: nothing is persisted and no marker exists. Programmatic (headless) use: <code>LFGBatch.runBatchHeadless(testset)<\/code> executes in memory (persistence <code>NOT_PERSISTED<\/code>, no marker); <code>LFGBatch.persistToDirectory(testResultsDirectoryHandle, result)<\/code> creates the evidence with the same verification; <code>LFGBatch.verifyEvidenceDirectory(campaignDirectoryHandle)<\/code> re-verifies any stored campaign independently (it accepts no options and always requires the final certified state).<\/li>\n<li><b>Manage → Open Campaign Report…<\/b> shows the last in-memory result and, with the folder linked, any stored campaign in <code>Test_Results/<\/code>; a stored campaign is verified when opened.<\/li>\n<\/ul>\n<\/section>\n\n<section id=\"folders\"><h2>12. Folders, files and naming<\/h2>\n<table><tr><th>Folder<\/th><th>Holds<\/th><th>Extension<\/th><th>Opened with<\/th><\/tr>\n<tr><td><code>Models/<\/code><\/td><td>Model bundles<\/td><td><code>.lfgmodel.json<\/code><\/td><td>Model dropdown, Load Model<\/td><\/tr>\n<tr><td><code>Presets/<\/code><\/td><td>Scenarios<\/td><td><code>.lfgpreset.json<\/code><\/td><td>Load Preset<\/td><\/tr>\n<tr><td><code>Formulas/<\/code><\/td><td>Formula packages<\/td><td><code>.lfgformula.json<\/code><\/td><td>Load Formula, formula tool Import…<\/td><\/tr>\n<tr><td><code>Configurations/<\/code><\/td><td>Run configurations<\/td><td><code>.lfgconfig.json<\/code><\/td><td>Manage → Import configuration…<\/td><\/tr>\n<tr><td><code>Run_Outputs/<\/code><\/td><td>Single-run verification exports (T, E, C)<\/td><td><code>.csv<\/code>, <code>.json<\/code><\/td><td>Not imported; for review<\/td><\/tr>\n<tr><td><code>Test_Sets/<\/code><\/td><td>Simulation Campaign definitions and scenarios<\/td><td><code>testset.json<\/code>, <code>.md<\/code><\/td><td>Manage → Run Campaign…<\/td><\/tr>\n<tr><td><code>Test_Results/<\/code><\/td><td>Automated campaign results, reports, manifests<\/td><td><code>.csv<\/code>, <code>.json<\/code>, <code>.md<\/code><\/td><td>Manage → Open Campaign Report…<\/td><\/tr>\n<tr><td><code>instructions/<\/code><\/td><td>Guides and templates for people and agents<\/td><td><code>.md<\/code>, <code>templates/*.json<\/code><\/td><td>Read only<\/td><\/tr>\n<tr><td><code>Help/<\/code><\/td><td>This help page<\/td><td><code>.html<\/code><\/td><td>Help button or open directly<\/td><\/tr><\/table>\n<ul><li>Every folder contains an <code>_INSTRUCTIONS_&lt;Folder&gt;.md<\/code> file. Anyone (person or AI agent) creating a file for a folder must read that folder's instructions first.<\/li>\n<li>Naming: <code>&lt;Short_Name&gt;_&lt;first-8-of-revision&gt;.&lt;kind&gt;.json<\/code>; letters, digits, <code>_<\/code> and <code>-<\/code> only.<\/li>\n<li>Never overwrite an existing file with different content; a new revision gets a new file name. Superseded files go to a <code>_superseded<\/code> sub-folder.<\/li>\n<li>Files are data only: the app never executes code from a file; unknown fields are dropped.<\/li><\/ul>\n<h3>Linking the folder<\/h3>\n<ol><li>Right frame → Custom (LFG) → <b>Link folder…<\/b>.<\/li>\n<li>Select <code>04_Orbital_Derivation<\/code> and allow access when the browser asks.<\/li>\n<li>The bar shows the linked folder. The browser may ask again in a new session; that is a browser security rule.<\/li><\/ol>\n<\/section>\n\n<section id=\"numerics\"><h2>13. Numerical settings<\/h2>\n<p>Integrator: Dormand–Prince 5(4) with adaptive step, in scaled units (length L0, time T0 = Kepler period / 2π).<\/p>\n<table><tr><th>Setting<\/th><th>Default<\/th><th>Guidance<\/th><\/tr>\n<tr><td>Relative tolerance (rtol)<\/td><td>1e-10<\/td><td>Main accuracy control. 1e-12 for publication-grade comparisons; 1e-8 for quick looks. Confirm with the convergence study.<\/td><\/tr>\n<tr><td>Absolute tolerance (atol)<\/td><td>1e-12<\/td><td>In scaled units; rarely needs changing.<\/td><\/tr>\n<tr><td>Max step (× T0)<\/td><td>0.05<\/td><td>Upper bound on the step; smaller values add points without much accuracy gain.<\/td><\/tr>\n<tr><td>Max steps<\/td><td>2,000,000<\/td><td>Safety stop. A run that hits it stops with a message.<\/td><\/tr>\n<tr><td>Marker interval<\/td><td>1 d<\/td><td>Display markers only; not integration steps.<\/td><\/tr><\/table>\n<p>High eccentricity needs more steps near perihelion; the adaptive step handles this automatically. A run is stopped if the body enters the nominal solar radius or escapes.<\/p>\n<\/section>\n\n<section id=\"physics\"><h2>14. Physics conventions<\/h2>\n<ul><li>SI units internally; distances display in km or AU. Numbers accept <code>1.5e3<\/code> and <code>1.5×10^3<\/code>.<\/li>\n<li>Orbit plane: +y = 12 o'clock, +x = 3 o'clock. Angles are measured counter-clockwise from 12 o'clock.<\/li>\n<li>Start state from a Kepler construction: p = a(1−e²), r = p/(1+e cos f), v<sub>r<\/sub> = √(μ/p) e sin f, v<sub>t<\/sub> = √(μ/p)(1+e cos f). After that the orbit follows the law and need not stay Keplerian.<\/li>\n<li><b>Fixed-source<\/b> treatment: μ = G·M<sub>central<\/sub>, the orbiting body is a test body. <b>Reciprocal<\/b>: μ = G(M<sub>central<\/sub> + M<sub>orbiting<\/sub>) with relative coordinates.<\/li>\n<li><b>startMu = pair<\/b> (default): every model starts from the identical Cartesian state built with the pair μ, so comparisons are like for like.<\/li>\n<li>Only one start-state representation (Kepler, polar or Cartesian) is authoritative; the others are kept equal to it.<\/li><\/ul>\n<\/section>\n\n<section id=\"integrity\"><h2>15. Scientific integrity rules<\/h2>\n<div class=\"rule\"><ul>\n<li>The expected (analytic) precession is a reference output. It never drives the trajectory and never calibrates a parameter.<\/li>\n<li>No fitting to Mercury's observed precession. No GR mechanism inside an LFG law. GR is an external comparison only.<\/li>\n<li>The Newtonian numerical floor is reported, never silently subtracted.<\/li>\n<li>Numerical executability and scientific validity are different things: \"Executable\" only means the law can be integrated.<\/li>\n<li>Check results are reported as passed, failed, unsupported or not run. Unsupported is never shown as passed.<\/li>\n<li>Revisions are immutable; any change makes a new revision id.<\/li><\/ul><\/div>\n<\/section>\n\n<section id=\"faq\"><h2>16. Troubleshooting and FAQ<\/h2>\n<dl class=\"qa\">\n<dt>Why is a value shown in red?<\/dt><dd>It differs from the selected model's Initial value. That is information, not an error. Restore the value or press Reset Model to return to Initial.<\/dd>\n<dt>Why can I not type in the Sun mass, Mercury mass, G or c?<\/dt><dd>They are permanently locked. Masses can be changed for another physical system only through a preset; G and c are fixed constants.<\/dd>\n<dt>A field does not accept typing.<\/dt><dd>Check its padlock: a closed padlock means a convenience lock is on. Click the padlock to unlock. Fields can also be inactive because another start-state representation is authoritative (section 14).<\/dd>\n<dt>Build says Custom (Preset) after I loaded a preset. Did something go wrong?<\/dt><dd>No. The preset differs from the model's Initial preset. Build reports that difference.<\/dd>\n<dt>I saved my preset but the values are still red.<\/dt><dd>Correct: saved does not mean Initial. Red marks a difference from the model's Initial values; the Save preset button returns to normal once there is nothing unsaved.<\/dd>\n<dt>The status says \"Inputs changed – restart needed\".<\/dt><dd>You edited an input after the run was computed. Press Reset, then Run.<\/dd>\n<dt>The status says \"Invalid input\".<\/dt><dd>A field is highlighted with a message under it. Typical causes: e ≥ 1, perihelion inside the Sun, a non-numeric value.<\/dd>\n<dt>No advance is shown.<\/dt><dd>At least two perihelia are needed. Use Calculate to end or a run length of 5 or more cycles.<\/dd>\n<dt>Newtonian shows a tiny non-zero advance.<\/dt><dd>That is the numerical floor of the integration. Tighten rtol or run the convergence study to see it shrink.<\/dd>\n<dt>The mouse wheel zooms instead of scrolling the page (or the other way round).<\/dt><dd>Toggle the padlock next to Fit + −. Ctrl + wheel always zooms.<\/dd>\n<dt>My formula says \"Not executable\".<\/dt><dd>The reason is shown under the law: undefined symbol, dimension mismatch, wrong scalar/vector type, or an evolving state. Fix it and the status updates live.<\/dd>\n<dt>\"Dimension mismatch\" in my formula.<\/dt><dd>A term has different units from the others. Compare each term with <code>mu/r^2<\/code> (m s⁻²).<\/dd>\n<dt>The formula tool says Customized; how do I go back?<\/dt><dd>Press Reset in the Model bar. It restores every field that has an Initial value.<\/dd>\n<dt>My model does not appear in the Model dropdown.<\/dt><dd>Link the folder (section 12) and check the file is a <code>.lfgmodel.json<\/code> in <code>Models/<\/code>. Or use Load Model and pick the file.<\/dd>\n<dt>Import says MODEL REVISION MISMATCH.<\/dt><dd>The configuration was made with a different bundle revision than the one now stored. The run can still be loaded, but it is not an exact reproduction; the audit records this.<\/dd>\n<dt>INTEGRITY ERROR when loading a model.<\/dt><dd>The file's declared revision does not match its content (the file was edited by hand). Remove the <code>bundleRevision<\/code> field or restore the original file.<\/dd>\n<dt>Where did my exported file go?<\/dt><dd>With the folder linked: into the matching sub-folder. Without: the browser's download folder.<\/dd>\n<dt>Can I change the gravitational constant for a test?<\/dt><dd>Not in the built-in models and not through a preset. Build a custom formula whose own constant represents the change.<\/dd>\n<dt>Does play speed affect results?<\/dt><dd>No. Speed, timing, zoom, units, markers and colours are display only.<\/dd>\n<dt>How do I reproduce someone's run?<\/dt><dd>Import their run configuration (Manage → Import configuration…) and Calculate to end. Compare with their audit CSV.<\/dd>\n<dt>How do I compare GR and an LFG model?<\/dt><dd>Run GR, Set baseline, select the LFG model, run. The baseline comparison table shows both measured advances from the identical start state.<\/dd>\n<dt>The browser asks for folder permission every time.<\/dt><dd>That is the browser's protection for local folders. Allow it; the simulator does not keep any other access.<\/dd>\n<\/dl>\n<\/section>\n\n<section id=\"glossary\"><h2>17. Glossary<\/h2>\n<table><tr><th>Symbol<\/th><th>Meaning<\/th><th>Unit<\/th><\/tr>\n<tr><td>a<\/td><td>Semi-major axis of the start ellipse<\/td><td>m<\/td><\/tr>\n<tr><td>e<\/td><td>Eccentricity of the start ellipse<\/td><td>–<\/td><\/tr>\n<tr><td>f<\/td><td>Start angle (true anomaly) measured from perihelion along the motion<\/td><td>°<\/td><\/tr>\n<tr><td>p<\/td><td>Semi-latus rectum a(1−e²)<\/td><td>m<\/td><\/tr>\n<tr><td>r<\/td><td>Distance (radial mode) or position vector (vector mode) of the orbiting body<\/td><td>m<\/td><\/tr>\n<tr><td>v<\/td><td>Velocity vector of the orbiting body<\/td><td>m s⁻¹<\/td><\/tr>\n<tr><td>t<\/td><td>Physical time since the start<\/td><td>s<\/td><\/tr>\n<tr><td>G<\/td><td>Newtonian constant of gravitation<\/td><td>m³ kg⁻¹ s⁻²<\/td><\/tr>\n<tr><td>c<\/td><td>Speed of light in vacuum<\/td><td>m s⁻¹<\/td><\/tr>\n<tr><td>M_Sun<\/td><td>Central mass<\/td><td>kg<\/td><\/tr>\n<tr><td>M_Merc<\/td><td>Orbiting mass<\/td><td>kg<\/td><\/tr>\n<tr><td>μ (mu)<\/td><td>Gravitational parameter of the law (G·M or G(M+m))<\/td><td>m³ s⁻²<\/td><\/tr>\n<tr><td>h<\/td><td>Specific angular momentum |r × v|<\/td><td>m² s⁻¹<\/td><\/tr>\n<tr><td>E<\/td><td>Specific energy of the model's own energy law<\/td><td>J kg⁻¹<\/td><\/tr>\n<tr><td>P<sub>r<\/sub><\/td><td>Radial period, perihelion to perihelion<\/td><td>d<\/td><\/tr>\n<tr><td>Δω<sub>meas<\/sub><\/td><td>Measured apsidal advance per radial cycle<\/td><td>rad, ″<\/td><\/tr>\n<tr><td>Δω<sub>exp<\/sub><\/td><td>Expected advance from the analytic formula (reference only)<\/td><td>rad, ″<\/td><\/tr>\n<tr><td>η (eta)<\/td><td>Strength parameter of the LFG Expansion-Field model (1 = candidate, 0 = Newtonian control)<\/td><td>–<\/td><\/tr>\n<tr><td>rtol<\/td><td>Relative error tolerance of the integrator<\/td><td>–<\/td><\/tr>\n<tr><td>atol<\/td><td>Absolute error tolerance (scaled units)<\/td><td>–<\/td><\/tr>\n<tr><td>T0<\/td><td>Time scale: Kepler period / 2π<\/td><td>s<\/td><\/tr>\n<tr><td>L0<\/td><td>Length scale of the scaled state<\/td><td>m<\/td><\/tr>\n<tr><td>Initial<\/td><td>The model's defined formula, parameters and preset<\/td><td>–<\/td><\/tr>\n<tr><td>Custom<\/td><td>Current effective value differs from Initial<\/td><td>–<\/td><\/tr>\n<tr><td>Unsaved<\/td><td>Current value differs from the loaded or saved file<\/td><td>–<\/td><\/tr>\n<tr><td>Revision<\/td><td>Content hash identity: r- formula, b- bundle, p- preset<\/td><td>–<\/td><\/tr><\/table>\n<\/section>\n\n<section id=\"constants\"><h2>18. Constants and sources<\/h2>\n<table><tr><th>Quantity<\/th><th>Value<\/th><th>Unit<\/th><th>Source and note<\/th><\/tr>\n<tr><td>Newtonian constant of gravitation G<\/td><td>6.67430e-11<\/td><td>m³ kg⁻¹ s⁻²<\/td><td>JPL Astrodynamic Parameters (2018 CODATA).<\/td><\/tr>\n<tr><td>Speed of light c<\/td><td>299792458<\/td><td>m s⁻¹<\/td><td>Exact SI definition.<\/td><\/tr>\n<tr><td>Astronomical unit<\/td><td>149597870700<\/td><td>m<\/td><td>IAU 2012 Resolution B1 (exact).<\/td><\/tr>\n<tr><td>GM of Sun<\/td><td>1.32712440041279419e20<\/td><td>m³ s⁻²<\/td><td>JPL DE440. M<sub>Sun<\/sub> = GM<sub>Sun<\/sub> / G.<\/td><\/tr>\n<tr><td>GM of Mercury<\/td><td>22031.868551<\/td><td>km³ s⁻²<\/td><td>JPL DE440. M<sub>Mercury<\/sub> = GM<sub>Mercury<\/sub> / G.<\/td><\/tr>\n<tr><td>Mercury semi-major axis a<\/td><td>0.38709927<\/td><td>au<\/td><td>JPL approximate positions, Table 1, J2000 mean element; used only to build the start state.<\/td><\/tr>\n<tr><td>Mercury eccentricity e<\/td><td>0.20563593<\/td><td>–<\/td><td>Same table and epoch; used only to build the start state. No observed precession value is stored or used.<\/td><\/tr>\n<tr><td>Nominal solar radius<\/td><td>6.957e8<\/td><td>m<\/td><td>IAU 2015 Resolution B3; collision guard only, never in a force law.<\/td><\/tr><\/table>\n<\/section>\n\n<section id=\"version\"><h2>19. Version and validation<\/h2>\n<ul><li>This help belongs to simulator v1.1.8. Every audit record and batch manifest records the simulator version and its <code>canonical_build_sha256<\/code>.<\/li>\n<li><b>v1.1.8 changes:<\/b> Artifact-completeness repair after independent rejection of frozen v1.1.7 (physics unchanged). Which T/E/C artifacts a campaign must contain is now recorded at execution time from the campaign definition and the execution result: <code>summary.json<\/code> holds one <code>artifactObligations<\/code> record per case (declared types, whether artifacts were produced, deterministic paths) and <code>batch_log.json<\/code> independently records the declared types, each case's produced paths and the full produced list. Certification requires the obligations to equal, exactly, the manifest artifact list, the integrity-inventory run entries, the stored <code>runs/<\/code> files, the REPORT artifact table and the <code>summary.csv<\/code> case rows, and each artifact's own embedded identity (case, RunToken, batch, campaign, artifact type) must match. A package can no longer redefine its own obligations by shrinking the manifest.<\/li>\n<li><b>v1.1.7 changes:<\/b> Bounded repair after independent rejection of frozen v1.1.6 (physics unchanged): (1) the build now escapes every <code>&lt;/<\/code> and <code>&lt;!--<\/code> in the embedded Help, and checks that every script block parses as the browser splits it, so the page and its controls load again; (2) <code>COMPLETE.json<\/code> has a strict schema: it must be a JSON object with exactly the required fields, each of the right type and equal to the value derived from the hash-bound manifest, <code>summary.json<\/code>, the directory and the running release; values such as <code>null<\/code>, <code>false<\/code>, <code>0<\/code> or <code>\"\"<\/code> are rejected; (3) the reported execution state and scientific classification come only from the hash-bound evidence, never from the marker; (4) the public verifier accepts no options and always requires the final certified state; (5) certification writes <code>CERTIFICATION_PENDING.json<\/code> first and removes it only after the complete package and marker are verified, so an interrupted or failed certification can never later verify as certified.<\/li>\n<li><b>v1.1.6 changes:<\/b> Complete evidence integrity inventory: the manifest binds every T/E/C artifact and the batch log, JSON/CSV summaries, and report by exact UTF-8 byte count and SHA-256; COMPLETE binds the manifest and file count. The read-only verifier checks every required file after the marker is written and rejects incomplete or ambiguous marker states. If COMPLETE cannot be removed after a failure, the hard error is explicit and the directory remains uncertified.<\/li>\n<li><b>v1.1.5 changes:<\/b> Bounded repair after independent rejection of frozen v1.1.4 (physics unchanged): (1) a failed evidence save can never leave <code>COMPLETE.json<\/code> behind: the marker is written only after the complete evidence set has been verified, and if anything fails afterwards the marker is removed and replaced by an <code>INCOMPLETE.json<\/code> failure record (if removal is impossible, a hard persistence error is reported and the directory is not certified); (2) comparisons are computed only when listed in the campaign's <code>comparisons<\/code>; nothing is inferred from case order, case count or case roles, and a campaign without declared comparisons reports &ldquo;No scientific comparison declared.&rdquo;<\/li>\n<li><b>v1.1.4 changes:<\/b> Execution-completion certification, reporting, and provenance release: Strict case-level execution completeness verification (requiring declared numerical completion condition such as cycles reached and normal completion stop code; premature stops such as step limits or divergence cannot receive COMPLETE); campaign execution state (COMPLETE/INCOMPLETE) strictly decoupled from scientific classification (PASS/QUALIFIED/INCONCLUSIVE/FAIL); removal of hardcoded numerical-floor thresholds (1e-4) from engine reporting and test-set claims, classifying thresholds as acceptance thresholds or regression references unless supported by empirical control evidence; explicit disambiguated report column labels (Measured Advance, Acceptance Target / Reference, Scientific Outcome, Execution Status); elimination of premature terminal marker claims in pre-persistence reports; and full Configuration C provenance cleanup with executed Cartesian state and declared metadata labels.<\/li>\n<li><b>v1.1.4 correction (owner-directed takeover of the initial v1.1.4 pass):<\/b> fixed a report crash for campaigns with a regression-benchmark note (the legacy TS-HIECC-01A campaign could not run); terminal markers are now written only after read-back verification of the complete evidence set (headless runs carry no marker); case-insensitive artifact-name collision safety; failed saves leave an <code>INCOMPLETE.json<\/code> record; crashes are <code>NOT_EVALUATED<\/code>, not FAIL; stop-on-failure keeps the failing case's artifacts; no default acceptance threshold; declared-only comparisons; per-control numerical-floor evidence; declared/unverified preset revisions labelled; manual exports never overwrite; short-name configurations appear in Import; stored campaigns can be opened and verified.<\/li>\n<li><b>v1.1.3 changes:<\/b> Evidence, completion semantics, and provenance release: Separation of scientific outcome (PASS/QUALIFIED/INCONCLUSIVE/FAIL) from execution completeness (COMPLETE/INCOMPLETE) so scientific failures remain legitimate scientific evidence with <code>COMPLETE.json<\/code>; explicit preflight validation of required artifact codes (T, E, C only; unknown codes rejected); unique campaign artifact identity with short case locator (<code>&lt;ModelCode&gt;_&lt;PresetCode&gt;_&lt;RunToken&gt;_&lt;CaseLocator&gt;_&lt;Artifact&gt;.&lt;ext&gt;<\/code>, ceiling ≤ 64 chars); strict directory collision halt without overwriting; invariant matched-cycle radial geometry across all start types (perihelion, aphelion, custom anomaly); full campaign execution binding and cryptographic <code>effective_configuration_hash<\/code> in T and E CSV audit headers; declared preset reference provenance; removal of hardcoded numerical floor assertions in reports; and post-write on-disk audit before final completion certification.<\/li>\n<li><b>v1.1.2 changes:<\/b> Automation, provenance, reporting, and measurement-cleanup release: Run Campaign UI scope fix, accurate persistence reporting, strict status severity precedence (PASS &lt; QUALIFIED &lt; INCONCLUSIVE &lt; FAIL), evaluated report claims and comparative controls, interrupted/failed campaign evidence preservation (<code>INCOMPLETE.json<\/code>), collision safety, model/preset revision verification, configuration C serialized from executed run, deterministic configuration-fingerprint RunToken, manifest hash and byte verification, matched-cycle geometric a/e summary statistic, phaseId compatibility, and UI terminology update to Simulation Campaign.<\/li>\n<li><b>v1.1.0 changes:<\/b> Short unique locator naming architecture (<code>&lt;ModelCode&gt;_&lt;PresetCode&gt;_&lt;RunToken&gt;_&lt;Artifact&gt;.&lt;ext&gt;<\/code>, hard ceiling ≤ 64 chars); Batch Run Autopilot (<code>LFGBatch<\/code>) for unattended scientific suite execution; isolated batch result folders with complete manifests, summaries, reports, and completion markers; addition of <code>Test_Sets/<\/code> and <code>Test_Results/<\/code> directories.<\/li>\n<li>The validation record <code>LFG_Orbit_Simulator_Validation.md<\/code> (next to the simulator) lists every revision, its file hashes and the test results.<\/li>\n<li>The release manifest <code>LFG_Orbit_Simulator_v&lt;version&gt;_MANIFEST.json<\/code> gives the exact file hash.<\/li><\/ul>\n<\/section>\n<\/main><\/div>\n<script>\n(function(){var q=document.getElementById('q'),secs=[].slice.call(document.querySelectorAll('main section')),nr=document.getElementById('nores');\nq.addEventListener('input',function(){var t=q.value.trim().toLowerCase(),n=0;secs.forEach(function(s){var hit=!t||s.textContent.toLowerCase().indexOf(t)>=0;s.classList.toggle('hide',!hit);if(hit)n++;});nr.style.display=n?'none':'block';});})();\n<\/script>\n<\/body><\/html>\n";
function openHelp() {
  const currentHelp = HELP_PAGE; let w = null;
  try { const u = URL.createObjectURL(new Blob([currentHelp], { type: 'text/html' })); w = window.open(u, '_blank'); } catch (e) { w = null; }
  if (w) return;
  $('helpBody').innerHTML = '<div class="helpbar"><b>Help</b><span class="sp"></span><button id="btnHelpClose">Close</button></div><iframe id="helpFrame" title="Help"></iframe>';
  $('helpFrame').srcdoc = currentHelp; $('help').style.display = 'flex'; $('btnHelpClose').onclick = () => { $('help').style.display = 'none'; };
}

/* ---------- main loop ---------- */
let lastDrawStamp = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtw = P.lastWall ? Math.min(0.1, (now - P.lastWall) / 1000) : 0; P.lastWall = now;
  if (run) {
    if (run.cont && !run.done) {
      const ref = isFinite(run.Tkep) ? run.Tkep : 88 * DAY;
      if (P.computeAll && P.calcTo === undefined) P.calcTo = run.t + 50 * ref;
      const target = P.computeAll ? P.calcTo : P.t + 2 * ref;
      if (run.t < target) { run.advance(P.computeAll ? 24 : 6); resultsDirty = true; autoRefit(false); }
      if (P.computeAll && run.t >= target) { P.computeAll = false; P.calcTo = undefined; if (V.auto) fitView(); statusFromRun(); }
    } else if (!run.done) { run.advance(P.computeAll ? 24 : 6); resultsDirty = true; autoRefit(false); if (run.done) { P.computeAll = false; if (V.auto) fitView(); statusFromRun(); } }
    if (P.playing) {
      let t = P.t + dtw * speedDaysPerSec() * DAY; const lim = run.t;
      if (P.stopAt !== null && t >= P.stopAt) { t = P.stopAt; P.stopAt = null; P.playing = false; $('btnRun').textContent = 'Run'; }
      if (t >= lim) { t = lim; if (run.done) { P.playing = false; $('btnRun').textContent = 'Run'; } }
      P.t = t; if (!P.playing) statusFromRun();
    }
    needDraw = true;
  }
  { const started = run && run.cfg.modelId === S.modelId && (P.playing || P.t > 0 || run.t > 0), L = started ? 'Running formula' : 'Selected formula'; const e = $('lawRunLbl'); if (e && e.textContent !== L) e.textContent = L; }
  const pr = $('sp_info'); if (pr) { const full = P.mapFrozen ? fmtSig(speedDaysPerSec(), 4) + ' d/s · ref ' + fmtSig(P.refPeriodS / DAY, 6) + ' d (' + P.refSource + ', frozen until Reset)' : fmtSig(speedDaysPerSec(), 4) + ' d/s · ref ' + fmtSig(refPeriodNow() / DAY, 6) + ' d (initial Kepler estimate)'; pr.textContent = full.replace('reference', 'ref').replace('(initial Kepler estimate)', '(initial est.)').replace(/frozen until Reset/, 'frozen'); pr.title = full; }
  if (needDraw) { draw(); updateLive(); drawMag(); $('elapsed').textContent = run ? 'elapsed ' + fmtSig(P.t / DAY, 7) + ' d' : ''; }
  if (resultsDirty && now - lastResultsStamp > 300) { lastResultsStamp = now; renderResults(); }
}

/* ---------- init ---------- */
function init() {
  S.modelId = 'gr-1pn'; LFGM.loadLib(); (typeof LFG_PRELOAD !== 'undefined' ? LFG_PRELOAD : []).forEach(t => { try { LFGM.importAny(t, { sourceName: 'embedded preload', confirmReplace: () => false }); } catch (e) { console.warn('preloaded model not loaded: ' + e.message); } }); LFGM.syncRegistry();
  buildLeft(); buildLive(); buildModelSelect(); renderModelPanels(); buildShapeCmp();
  { const ini = getInitial(); PRESETINFO = { name: ini.preset.name, source: 'initial-bundle', revision: ini.presetRevision }; $('presetName').textContent = ini.preset.name; $('presetNote').textContent = ini.preset.description ? '(' + ini.preset.description + ')' : ''; }
  if (typeof LFGE !== 'undefined') LFGE.folderInit(() => { buildModelSelect(); try { updateShapeCmp(); } catch (e) { } });
  cv = $('cv'); ctx = cv.getContext('2d');
  const _ft = ctx.fillText.bind(ctx); ctx.fillText = function (t, x, y) { ctx.save(); ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.strokeText(t, x, y); ctx.restore(); _ft(t, x, y); };
  for (const k in NF) $('in_' + k).addEventListener('input', () => onNum(k));
  $('sel_start').onchange = e => { S.startMode = e.target.value; if (S.startMode === 'perihelion') S.fDeg = 0; if (S.startMode === 'aphelion') S.fDeg = 180; afterEdit(); fitView(); };
  $('sel_dir').onchange = e => { S.dir = e.target.value; afterEdit(); };
  $('sel_runPre').onchange = e => { const v = e.target.value; customRun = v === 'custom'; if (v === 'cont') S.runMode = 'cont'; else if (v === 'custom') { if (S.runMode === 'cont') { S.runMode = 'cycles'; S.runValue = 5; } } else { S.runMode = 'cycles'; S.runValue = +v; } refreshFields(); afterEdit(); };
  $('sel_runMode').onchange = e => { S.runMode = e.target.value; S.runValue = S.runMode === 'cycles' ? 5 : 440; refreshFields(); afterEdit(); };
  document.querySelectorAll('input[name=initMode]').forEach(r => r.onchange = e => { const st = LFG.buildInitial(S); S.cart = { x: st.x, y: st.y, vx: st.vx, vy: st.vy }; S.polar = LFG.toPolar(st); S.initMode = e.target.value; afterEdit(); });
