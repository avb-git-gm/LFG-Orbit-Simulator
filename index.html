    const reqMode = s.runMode, reqValue = s.runValue, completedCycles = r.periCount - 1;
    let executionComplete = false, executionNote = '';
    if (r.status.code !== 'complete') {
      executionNote = `Premature stop with code "${r.status.code}": ${r.status.message || 'incomplete run'}`;
    } else if (reqMode === 'cycles') {
      executionComplete = completedCycles >= reqValue;
      executionNote = executionComplete ? `Completion condition reached (${completedCycles}/${reqValue} radial cycles).` : `Stop code "complete" but only ${completedCycles} of ${reqValue} requested radial cycles were completed.`;
    } else if (reqMode === 'days') {
      const targetSec = reqValue * 86400;
      executionComplete = r.t >= targetSec * (1 - 1e-9);
      executionNote = executionComplete ? `Completion condition reached (${r.t.toFixed(1)} s >= ${targetSec.toFixed(1)} s).` : `Stop code "complete" but duration ${r.t.toFixed(1)} s < requested ${targetSec.toFixed(1)} s.`;
    } else {
      executionNote = `runMode "${reqMode}" has no campaign completion condition.`;
    }

    // 2. SCIENCE: evaluated only for execution-complete cases; thresholds come only from the campaign definition.
    const acc = caseDef.acceptance || {};
    let outcome = 'PASS';
    const outcomeNotes = [];
    if (!executionComplete) {
      outcome = 'NOT_EVALUATED';
      outcomeNotes.push('Not scientifically evaluated: the declared completion condition was not reached.');
    } else {
      if (acc.runStopCode && r.status.code !== acc.runStopCode) { outcome = worstStatus(outcome, 'FAIL'); outcomeNotes.push(`Stop code "${r.status.code}" does not match declared "${acc.runStopCode}".`); }
      if (typeof acc.maxRejectedSteps === 'number' && r.rejected > acc.maxRejectedSteps) { outcome = worstStatus(outcome, 'FAIL'); outcomeNotes.push(`Rejected steps ${r.rejected} exceed declared maximum ${acc.maxRejectedSteps}.`); }
      if (typeof acc.minCycles === 'number' && completedCycles < acc.minCycles) { outcome = worstStatus(outcome, 'FAIL'); outcomeNotes.push(`Completed cycles ${completedCycles} below declared minimum ${acc.minCycles}.`); }
      if (typeof acc.expectedAdvanceArcsec === 'number') {
        if (typeof acc.advanceTolArcsec === 'number') {
          const diff = Math.abs(res.advArcsec - acc.expectedAdvanceArcsec);
          if (!(diff <= acc.advanceTolArcsec)) { outcome = worstStatus(outcome, 'QUALIFIED'); outcomeNotes.push(`Measured advance differs from the declared acceptance target by ${diff.toExponential(3)}″ > declared acceptance threshold ${acc.advanceTolArcsec}″.`); }
          else outcomeNotes.push(`Measured advance within declared acceptance threshold (|difference| = ${diff.toExponential(3)}″ <= ${acc.advanceTolArcsec}″).`);
        } else {
          outcomeNotes.push('Acceptance target declared without an acceptance threshold: recorded only, not evaluated.');
        }
      }
    }
    const stopRequested = !!(caseDef.policy && caseDef.policy.stopOnFailure && (outcome === 'FAIL' || !executionComplete));

    const mCode = LFG.modelCode(r.model);
    const pCode = LFG.presetCode(caseDef.preset.name, caseDef.preset.revision);
    const rToken = LFG.runTokenOf(runCfg);
    const caseLoc = caseLocatorOf(caseDef);
    const locBase = LFG.shortLocator(mCode, pCode, rToken, caseLoc);
    const m = LFG.MODELS[caseDef.model.id];
    const ini = (typeof LFGM !== 'undefined' && LFGM.initialOf) ? LFGM.initialOf(caseDef.model.id) : null;
    const caseRole = caseDef.role || (ts && ts.cases && caseDef.caseId === ts.cases[0].caseId ? 'baseline' : 'candidate');
    const batchContext = { testSetId: (ts && ts.testSetId) || 'MANUAL', phaseId: (ts && ts.phaseId) || null, batchToken: batchToken || '000000', caseId: caseDef.caseId, caseRole };
    const effHash = LFG.effectiveConfigHashOf(runCfg);
    const meta = {
      S: s,
      presetName: caseDef.preset.name,
      presetNote: caseDef.preset.description || '',
      bodies: { central: 'Sun', orbiting: 'Mercury' },
      ident: {
        bundleRevision: caseDef.model.bundleRevision || (ini && ini.bundleRevision) || 'builtin',
        formulaRevision: caseDef.model.formulaRevision || (m && m.package && m.package.revision) || 'builtin',
        presetRevision: caseDef.preset.revision || 'NOT_DECLARED',
        presetRevisionStatus: caseDef.preset.revision ? 'DECLARED_UNVERIFIED (campaign reference only; the preset file is not loaded by the campaign engine)' : 'NOT_DECLARED',
        presetSource: 'CAMPAIGN_INLINE_SETTINGS (executed from the campaign case settings; preset file not loaded)',
        presetName: caseDef.preset.name,
        buildState: 'CAMPAIGN_INLINE (executed from campaign settings; not compared with a model Initial bundle)',
        provenance: caseDef.provenance || 'DECLARED_REFERENCE',
        effectiveConfigHash: effHash
      },
      runToken: rToken,
      batchContext
    };

    const artifacts = [];
    const artDefs = caseDef.artifacts || ALLOWED_ARTIFACTS;
    if (artDefs.includes('T')) artifacts.push({ name: `${locBase}_T.csv`, text: LFG.trajectoryCSV(r, meta, locBase), type: 'trajectory', runToken: rToken, caseId: caseDef.caseId, caseLocator: caseLoc });
    if (artDefs.includes('E')) artifacts.push({ name: `${locBase}_E.csv`, text: LFG.eventsCSV(r, meta, locBase), type: 'events', runToken: rToken, caseId: caseDef.caseId, caseLocator: caseLoc });
    if (artDefs.includes('C')) artifacts.push({ name: `${locBase}_C.json`, text: JSON.stringify(LFG.makeConfig(s, meta.ident, r, batchContext), null, 2), type: 'config', runToken: rToken, caseId: caseDef.caseId, caseLocator: caseLoc });
    artifacts.forEach(rf => { rf.bytes = utf8ByteLength(rf.text); rf.sha256 = sha256Hex(rf.text); });

    const summary = {
      caseId: caseDef.caseId, caseRole, roleDeclared: !!caseDef.role, caseLocator: caseLoc,
      modelId: caseDef.model.id, modelName: r.model.name, modelCode: mCode,
      presetName: caseDef.preset.name, presetCode: pCode,
      a_m: s.a, e: s.e, startMode: s.startMode, rtol: s.numerics.rtol, atol: s.numerics.atol,
      runToken: rToken, effectiveConfigurationHash: effHash, locatorBase: locBase,
      status: r.status.code, executionComplete, executionNote,
      outcome, outcomeNote: outcomeNotes.length ? outcomeNotes.join(' ') : 'All declared acceptance criteria satisfied.',
      stopRequested,
      acceptedSteps: r.accepted, rejectedSteps: r.rejected, completedCycles,
      measuredAdvanceArcsec: res.advArcsec,
      analyticReferenceArcsec: analyticAdvanceArcsec(r),
      expectedAdvanceArcsec: acc.expectedAdvanceArcsec !== undefined ? acc.expectedAdvanceArcsec : null,
      advanceTolArcsec: acc.advanceTolArcsec !== undefined ? acc.advanceTolArcsec : null,
      radialPeriodSeconds: res.Pr, meanApoapsisM: res.raMean, meanPeriapsisM: res.rpMean,
      geometricSemiMajorAxisM: res.aGeo, geometricEccentricity: res.eGeo, geoStatus: res.geoStatus || null
    };
    return { summary, artifacts, run: r };
  }

  function placeholderSummary(cDef, i, status, note) {
    return {
      caseId: cDef.caseId, caseRole: cDef.role || (i === 0 ? 'baseline' : 'candidate'), roleDeclared: !!cDef.role, caseLocator: caseLocatorOf(cDef),
      modelId: cDef.model.id, modelName: (LFG.MODELS[cDef.model.id] && LFG.MODELS[cDef.model.id].name) || cDef.model.id, modelCode: 'N/A',
      presetName: (cDef.preset && cDef.preset.name) || 'unknown', presetCode: 'N/A',
      a_m: cDef.settings && cDef.settings.a, e: cDef.settings && cDef.settings.e,
      runToken: 'N/A', effectiveConfigurationHash: null, locatorBase: 'N/A',
      status, executionComplete: false, executionNote: note,
      outcome: 'NOT_EVALUATED', outcomeNote: 'Not scientifically evaluated (' + (status === 'not_executed' ? 'case not executed' : 'execution error') + ').',
      stopRequested: false, acceptedSteps: 0, rejectedSteps: 0, completedCycles: 0,
      measuredAdvanceArcsec: null, analyticReferenceArcsec: null, expectedAdvanceArcsec: null, advanceTolArcsec: null,
      radialPeriodSeconds: null, meanApoapsisM: null, meanPeriapsisM: null, geometricSemiMajorAxisM: null, geometricEccentricity: null, geoStatus: null
    };
  }

  function generateReport(data, ts) {
    const L = [];
    L.push(`# Simulation Campaign Report: ${ts.title || ts.testSetId}`);
    L.push(``);
    L.push(`- **Campaign / Test-Set ID:** \`${ts.testSetId}\``);
    if (ts.phaseId) L.push(`- **Phase ID:** \`${ts.phaseId}\``);
    L.push(`- **Batch Token:** \`${data.batchToken}\``);
    L.push(`- **Simulator Version:** \`${data.simulatorVersion}\``);
    L.push(`- **Canonical Build Hash:** \`${data.canonicalSha256}\``);
    L.push(`- **UTC Start / End:** \`${data.startUtc}\` / \`${data.endUtc}\``);
    L.push(`- **Scientific Purpose (campaign-declared):** ${ts.purpose || 'not stated'}`);
    L.push(`- **Execution state (in memory):** \`${data.executionState}\``);
    L.push(`- **Scientific classification:** \`${data.scientificStatus}\``);
    L.push(`- **Evidence persistence:** not certified by this report. Storage is certified only by the terminal marker (\`COMPLETE.json\` or \`INCOMPLETE.json\`) written after read-back verification of every file.`);
    L.push(``);
    L.push(`## 1. Cases`);
    L.push(``);
    L.push(`| Case ID | Role | Model | Code | Run Token | Stop Code | Execution | Cycles | Steps (acc / rej) | Measured Advance (″/cycle) | Analytic Reference (″/cycle) | Acceptance Target (declared, ″/cycle) | Acceptance Threshold (declared, ″/cycle) | Scientific Outcome |`);
    L.push(`| :--- | :--- | :--- | :---: | :---: | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |`);
    data.cases.forEach(c => {
      L.push(`| **${c.caseId}** | ${c.caseRole}${c.roleDeclared ? '' : ' (default)'} | ${c.modelName} | \`${c.modelCode}\` | \`${c.runToken}\` | \`${c.status}\` | \`${c.executionComplete ? 'COMPLETE' : 'INCOMPLETE'}\` | ${c.completedCycles} | ${c.acceptedSteps} / ${c.rejectedSteps} | ${fmt(c.measuredAdvanceArcsec, 11)} | ${fmt(c.analyticReferenceArcsec, 11)} | ${fmt(c.expectedAdvanceArcsec, 11)} | ${c.advanceTolArcsec === null ? 'N/A' : c.advanceTolArcsec} | \`${c.outcome}\` |`);
    });
    L.push(``);
    data.cases.forEach(c => L.push(`- **${c.caseId}:** execution: ${c.executionNote} Evaluation: ${c.outcomeNote}`));
    L.push(``);
    L.push(`Definitions: *Measured Advance* is the mean apsidal advance per completed radial cycle measured from the integrated trajectory. *Analytic Reference* is the model's own declared reference formula evaluated at the initial state; it never drives the trajectory (N/A when the model declares none). *Acceptance Target* and *Acceptance Threshold* are campaign-declared values; a target without a declared threshold is recorded and not evaluated.`);
    L.push(``);

    L.push(`## 2. Comparisons`);
    L.push(``);
    if (!data.comparisons.length) {
      L.push(`No scientific comparison declared. No delta between cases is computed; individual case results are reported in section 1. (A comparison is computed only when the campaign lists it explicitly in \`comparisons: [{"baseline": caseId, "candidate": caseId}]\`; nothing is inferred from case order, case count or case roles.)`);
      L.push(``);
    }
    const rbTop = ts.regressionBenchmarks;
    if (rbTop && typeof rbTop === 'object' && !Array.isArray(rbTop)) {
      L.push(`Campaign-level \`regressionBenchmarks\` (campaign-declared values, reproduced verbatim; not attached to any comparison and not evaluated by the simulator):`);
      L.push(``);
      Object.keys(rbTop).filter(k => k !== 'note').forEach(k => L.push(`- \`${k}\`: \`${typeof rbTop[k] === 'object' ? JSON.stringify(rbTop[k]) : rbTop[k]}\``));
      L.push(``);
      if (rbTop.note) { L.push(`> **Campaign-declared note (author text; not evaluated by the simulator):** ${rbTop.note}`); L.push(``); }
    }
    data.comparisons.forEach((cp, k) => {
      const cb = data.cases.find(c => c.caseId === cp.baseline), cc = data.cases.find(c => c.caseId === cp.candidate);
      L.push(`### 2.${k + 1} ${cp.label}: ${cc ? cc.modelName : cp.candidate} [${cp.candidate}] minus ${cb ? cb.modelName : cp.baseline} [${cp.baseline}]`);
      L.push(``);
      L.push(`Source of this comparison: ${cp.source}.`);
      L.push(``);
      if (!cp.available) { L.push(`Not computed: ${cp.reason}`); L.push(``); return; }
      const b = cp.regressionBenchmarks || {};
      L.push(`| Metric | Comparison Delta (measured, candidate − baseline) | Regression Reference (campaign-declared) | \\|Delta − Regression Reference\\| |`);
      L.push(`| :--- | :---: | :---: | :---: |`);
      const row = (label, d, ref, f) => {
        const hasRef = typeof ref === 'number' && isFinite(ref);
        L.push(`| ${label} | \`${f(d)}\` | ${hasRef ? '`' + f(ref) + '`' : 'not declared'} | ${hasRef ? '`' + fmtE(Math.abs(d - ref), 3) + '`' : 'N/A'} |`);
      };
      row('Apsidal advance Δω (″/cycle)', cp.deltaAdvanceArcsecPerCycle, b.deltaAdvanceArcsecPerCycle, v => fmtE(v, 6));
      row('Radial period ΔPr (s)', cp.deltaRadialPeriodSeconds, b.deltaRadialPeriodSeconds, v => fmt(v, 6));
      row('Mean aphelion Δr_a (km)', cp.deltaMeanAphelionKm, b.deltaMeanAphelionKm, v => fmt(v, 6));
      row('Geometric semi-major axis Δa_geo (km)', cp.deltaGeometricSemiMajorAxisKm, b.deltaGeometricSemiMajorAxisKm, v => fmt(v, 6));
      row('Geometric eccentricity Δe_geo', cp.deltaGeometricEccentricity, b.deltaGeometricEccentricity, v => fmtE(v, 6));
      L.push(``);
      if (b.note) { L.push(`> **Campaign-declared note (author text; not evaluated by the simulator):** ${b.note}`); L.push(``); }
    });

    L.push(`## 3. Numerical Floor`);
    L.push(``);
    const controls = data.cases.filter(c => c.caseRole === 'control' || c.modelCode === 'NEW');
    const declared = typeof ts.numericalFloorArcsecPerCycle === 'number' ? ts.numericalFloorArcsecPerCycle : null;
    if (controls.length) {
      L.push(`| Control case | a (m) | e | rtol / atol | Newtonian control residual (measured, ″/cycle) |${declared !== null ? ' vs campaign-declared floor |' : ''}`);
      L.push(`| :--- | :---: | :---: | :---: | :---: |${declared !== null ? ' :---: |' : ''}`);
      controls.forEach(c => {
        const v = typeof c.measuredAdvanceArcsec === 'number' ? Math.abs(c.measuredAdvanceArcsec) : null;
        L.push(`| ${c.caseId} | ${c.a_m} | ${c.e} | ${c.rtol} / ${c.atol} | ${v === null ? 'UNAVAILABLE' : v.toExponential(4)} |${declared !== null ? ' ' + (v === null ? 'N/A' : (v <= declared ? 'within' : 'exceeds')) + ' |' : ''}`);
      });
      L.push(``);
    }
    if (declared !== null) L.push(`- **Numerical Floor (campaign-declared):** \`${declared.toExponential(4)}″/cycle\`.`);
    else if (controls.length) L.push(`- **Numerical Floor:** no campaign-wide value declared. The control residuals above are measured floor evidence for their own geometry and numerical configuration only; they are not applied to other cases.`);
    else L.push(`- **Numerical Floor:** \`UNAVAILABLE\` (no control case executed and no numerical floor declared by the campaign).`);
    L.push(``);

    L.push(`## 4. Generated Artifacts`);
    L.push(``);
    L.push(`| Artifact File | Case ID | Run Token | Type | Size (bytes) | SHA-256 |`);
    L.push(`| :--- | :--- | :---: | :--- | :---: | :--- |`);
    data.runFiles.forEach(rf => L.push(`| \`runs/${rf.name}\` | ${rf.caseId} | \`${rf.runToken}\` | ${rf.type === 'trajectory' ? 'Trajectory (T)' : rf.type === 'events' ? 'Events & Results (E)' : 'Configuration (C)'} | ${rf.bytes} | \`${rf.sha256}\` |`));
    L.push(``);

    const ex = data.cases.filter(c => c.executionComplete);
    L.push(`## 5. Execution and Classification Summary`);
    L.push(``);
    L.push(`- **Execution state (in memory):** \`${data.executionState}\`${data.incompleteReasons.length ? ' — ' + data.incompleteReasons.join(' ') : ''}`);
    L.push(`- **Scientific classification:** \`${data.scientificStatus}\` (worst outcome over evaluated cases; any not-evaluated case makes it at least INCONCLUSIVE).`);
    L.push(`- **Cases:** ${ts.cases.length} declared; ${ex.length} execution-complete; PASS ${data.counts.casesPass}, QUALIFIED ${data.counts.casesQualified}, INCONCLUSIVE ${data.counts.casesInconclusive}, FAIL ${data.counts.casesFail}, NOT_EVALUATED ${data.counts.casesNotEvaluated} (of which not executed ${data.counts.casesNotExecuted}).`);
    L.push(`- **Integrator step rejections (all executed cases):** ${data.cases.reduce((s, c) => s + (c.rejectedSteps || 0), 0)}.`);
    L.push(`- **Minimum completed radial cycles (execution-complete cases):** ${ex.length ? Math.min(...ex.map(c => c.completedCycles || 0)) : 'N/A'}.`);
    L.push(`- **Longest artifact file name:** ${data.runFiles.length ? Math.max(...data.runFiles.map(rf => rf.name.length)) : 0} characters (limit 64).`);
    L.push(`- **Evidence persistence:** see the terminal marker file in this directory.`);
    L.push(``);
    return L.join('\n');
  }

  function executeBatch(ts, options) {
    const val = validate(ts);
    if (!val.valid) throw new Error(val.error);
    const startUtc = new Date().toISOString();
    const batchToken = fnv6Hex(ts.testSetId + '_' + Date.now().toString());
    const batchDir = `${ts.testSetId}_${batchToken}`;
    const log = [];
    const pushLog = (type, detail) => { const entry = { timestamp: new Date().toISOString(), type, detail }; log.push(entry); if (options && options.onLog) options.onLog(entry); };
    // v1.1.8: declared artifact obligations come from the campaign definition (canonical order T, E, C), recorded before execution
    const declaredObligations = ts.cases.map(c => ({ caseId: c.caseId, requiredTypes: ALLOWED_ARTIFACTS.filter(t => (c.artifacts || ALLOWED_ARTIFACTS).includes(t)) }));
    pushLog('BATCH_START', { testSetId: ts.testSetId, phaseId: ts.phaseId || null, batchToken, simulatorVersion: LFG.SIM_VERSION, artifactObligations: declaredObligations });

    const caseSummaries = [], allRunFiles = [];
    let stoppedAfter = null;
    for (let i = 0; i < ts.cases.length; i++) {
      const cDef = ts.cases[i];
      if (stoppedAfter) {
        caseSummaries.push(placeholderSummary(cDef, i, 'not_executed', `Not executed: campaign stopped by stopOnFailure policy after case ${stoppedAfter}.`));
        pushLog('CASE_NOT_EXECUTED', { caseId: cDef.caseId, stoppedAfter });
        continue;
      }
      pushLog('CASE_START', { caseId: cDef.caseId, model: cDef.model.id });
      if (options && options.onProgress) options.onProgress({ caseIndex: i + 1, totalCases: ts.cases.length, caseId: cDef.caseId, status: 'Running...' });
      try {
        const out = runCaseSync(cDef, ts, batchToken);
        caseSummaries.push(out.summary);
        out.artifacts.forEach(a => allRunFiles.push(a));
        pushLog('CASE_COMPLETE', { caseId: cDef.caseId, locator: out.summary.locatorBase, executionComplete: out.summary.executionComplete, outcome: out.summary.outcome, advance: out.summary.measuredAdvanceArcsec, artifacts: out.artifacts.map(a => 'runs/' + a.name) });
        const policyStop = ts.policy && ts.policy.stopOnFailure && (out.summary.outcome === 'FAIL' || !out.summary.executionComplete);
        if (out.summary.stopRequested || policyStop) stoppedAfter = cDef.caseId;
      } catch (err) {
        pushLog('CASE_EXECUTION_ERROR', { caseId: cDef.caseId, error: err.message });
        caseSummaries.push(placeholderSummary(cDef, i, 'error', `Execution error: ${err.message}`));
        if ((ts.policy && ts.policy.stopOnFailure) || (cDef.policy && cDef.policy.stopOnFailure)) stoppedAfter = cDef.caseId;
      }
    }
    const endUtc = new Date().toISOString();

    // artifact name uniqueness (Windows: case-insensitive)
    const seenNames = new Map(), dupNames = [];
    allRunFiles.forEach(rf => { const k = rf.name.toLowerCase(); if (seenNames.has(k)) dupNames.push(rf.name); else seenNames.set(k, rf.caseId); });

    const comparisons = declaredComparisons(ts).map(cp => {
      const b = caseSummaries.find(c => c.caseId.toLowerCase() === String(cp.baseline).toLowerCase());
      const c = caseSummaries.find(x => x.caseId.toLowerCase() === String(cp.candidate).toLowerCase());
      const out = Object.assign({}, cp, { baseline: b ? b.caseId : cp.baseline, candidate: c ? c.caseId : cp.candidate });
      if (!b || !c || !b.executionComplete || !c.executionComplete || typeof b.measuredAdvanceArcsec !== 'number' || typeof c.measuredAdvanceArcsec !== 'number') {
        return Object.assign(out, { available: false, reason: 'both cases must be execution-complete with measured results.' });
      }
      return Object.assign(out, {
        available: true,
        baselineCaseId: b.caseId, comparisonCaseId: c.caseId,
        deltaAdvanceArcsecPerCycle: c.measuredAdvanceArcsec - b.measuredAdvanceArcsec,
        deltaRadialPeriodSeconds: c.radialPeriodSeconds - b.radialPeriodSeconds,
        deltaMeanAphelionKm: (c.meanApoapsisM - b.meanApoapsisM) / 1000,
        deltaGeometricSemiMajorAxisKm: (c.geometricSemiMajorAxisM - b.geometricSemiMajorAxisM) / 1000,
        deltaGeometricEccentricity: c.geometricEccentricity - b.geometricEccentricity
      });
    });

    const counts = { casesPass: 0, casesQualified: 0, casesInconclusive: 0, casesFail: 0, casesNotEvaluated: 0, casesNotExecuted: 0, casesExecutionComplete: 0, casesTotal: ts.cases.length };
    caseSummaries.forEach(c => {
      if (c.outcome === 'PASS') counts.casesPass++; else if (c.outcome === 'QUALIFIED') counts.casesQualified++; else if (c.outcome === 'INCONCLUSIVE') counts.casesInconclusive++; else if (c.outcome === 'FAIL') counts.casesFail++; else counts.casesNotEvaluated++;
      if (c.status === 'not_executed') counts.casesNotExecuted++;
      if (c.executionComplete) counts.casesExecutionComplete++;
    });
    let scientificStatus;
    const evaluated = caseSummaries.filter(c => RANK[c.outcome] !== undefined);
    if (!evaluated.length) scientificStatus = 'NOT_EVALUATED';
    else {
      scientificStatus = evaluated.reduce((s, c) => worstStatus(s, c.outcome), 'PASS');
      if (counts.casesNotEvaluated > 0) scientificStatus = worstStatus(scientificStatus, 'INCONCLUSIVE');
    }

    const totalExpectedArtifacts = ts.cases.reduce((sum, c) => sum + (c.artifacts || ALLOWED_ARTIFACTS).length, 0);
    const allCasesExecuted = caseSummaries.length === ts.cases.length && caseSummaries.every(c => c.executionComplete === true);
    const artifactsComplete = allRunFiles.length === totalExpectedArtifacts;
    const executionState = (allCasesExecuted && artifactsComplete && !dupNames.length) ? 'COMPLETE' : 'INCOMPLETE';
    const incompleteReasons = [];
    if (stoppedAfter) incompleteReasons.push(`Stopped by stopOnFailure policy after case ${stoppedAfter}.`);
    const inc = caseSummaries.filter(c => !c.executionComplete);
    if (inc.length) incompleteReasons.push(`Cases not execution-complete: ${inc.map(c => `${c.caseId} [${c.status}]: ${c.executionNote}`).join(' | ')}.`);
    if (!artifactsComplete) incompleteReasons.push(`Artifact count mismatch: expected ${totalExpectedArtifacts}, generated ${allRunFiles.length}.`);
    if (dupNames.length) incompleteReasons.push(`Duplicate artifact file names (case-insensitive): ${dupNames.join(', ')}.`);

    const data = {
      testSetId: ts.testSetId, phaseId: ts.phaseId || null, batchToken, batchDir,
      simulatorVersion: LFG.SIM_VERSION, canonicalSha256: LFG.BUILD.canonicalSha256, startUtc, endUtc,
      executionState, scientificStatus, status: scientificStatus, counts, incompleteReasons,
      cases: caseSummaries, comparisons, comparative: comparisons.find(c => c.available) || null, runFiles: allRunFiles
    };
    const reportMd = generateReport(data, ts);
    const reportSha256 = sha256Hex(reportMd);

    const num = v => (v === null || v === undefined) ? '' : v;
    const sumCsvHeader = 'case_id,role,role_declared,model_code,preset_code,run_token,locator,stop_code,execution_status,outcome,accepted_steps,rejected_steps,cycles,advance_arcsec,analytic_reference_arcsec,acceptance_target_arcsec,acceptance_threshold_arcsec,radial_period_s,aphelion_m,perihelion_m,a_geo_m,e_geo\n';

  /* ---------- evidence persistence and verification (any File System Access directory handle) ---------- */
  async function listEntries(dir) {
    const files = [], dirs = {};
    for await (const [name, ent] of dir.entries()) { if (ent.kind === 'file') files.push(name); else dirs[name] = ent; }
    return { files, dirs };
  }
  async function readFileText(dir, name) {
    const fh = await dir.getFileHandle(name), f = await fh.getFile(), bytes = new Uint8Array(await f.arrayBuffer());
    const text = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true }).decode(bytes);
    const encoded = new TextEncoder().encode(text);
    if (encoded.length !== bytes.length || encoded.some((b, i) => b !== bytes[i])) throw new Error(`${name} is not canonical UTF-8 text.`);
    return { size: f.size, text };
  }
  async function writeAndCheck(dir, name, text, expBytes, expSha) {
    let exists = false;
    try { await dir.getFileHandle(name); exists = true; } catch (e) { exists = false; }
    if (exists) throw new Error(`Refusing to overwrite existing file ${name}.`);
    const fh = await dir.getFileHandle(name, { create: true }), w = await fh.createWritable();
    await w.write(text); await w.close();
    const f = await (await dir.getFileHandle(name)).getFile();
    const bytes = expBytes !== undefined ? expBytes : utf8ByteLength(text), sha = expSha || sha256Hex(text);
    if (f.size !== bytes) throw new Error(`Read-back size mismatch on ${name}: ${f.size} != ${bytes}.`);
    const got = sha256Hex((await readFileText(dir, name)).text);
    if (got !== sha) throw new Error(`Read-back SHA-256 mismatch on ${name}.`);
  }

     Directory states (top level of Test_Results/<testSetId>_<BatchToken>/):
       COMPLETE.json only + fully verified package ............ CERTIFIED (the only certifiable state)
       INCOMPLETE.json only .................................. stored, NOT certified
       CERTIFICATION_PENDING.json present (with anything) ..... NOT certified (interrupted or failed certification)
       COMPLETE + INCOMPLETE, no terminal marker, alternate
       marker spellings, unexpected files ..................... NOT certified
     COMPLETE.json has a strict schema: every field is required, typed, and must equal a value derived from hash-bound
     evidence (manifest.json, the integrity inventory, summary.json, the directory itself) and the running release identity.
     The verifier never uses JavaScript truthiness to decide existence or validity, and never reports classification
     taken from the marker: executionState / scientificStatus are returned from hash-bound evidence only. */

  const COMPLETE_KEYS = ['format', 'formatVersion', 'testSetId', 'phaseId', 'batchToken', 'batchDirectory', 'simulatorVersion', 'canonicalBuildSha256',

            BATCH_EXECUTED produced list), both hash-bound through the integrity inventory
         -> deterministic paths runs/<model>_<preset>_<RunToken>_<caseLocator>_<T|E|C>.<csv|json>
         == manifest.json artifacts == integrityInventory run entries == stored runs/ files
            (and == REPORT.md artifact table, summary.csv case rows, and each artifact's own embedded identity)

         -> public final verification.
     The required set is never taken from manifest.artifacts or integrityInventory. */
  const ARTIFACT_KIND = {

    E: { type: 'events', ext: '.csv', exportType: 'EventsResults', label: 'Events & Results (E)' },
    C: { type: 'config', ext: '.json', format: 'LFG-Orbit-Simulator-config', label: 'Configuration (C)' }

  function artifactPathFor(locBase, t) { return 'runs/' + locBase + '_' + t + ARTIFACT_KIND[t].ext; }
  function csvHeaderMap(text) {
    const m = {};

  function countsFromCases(cases) {

    cases.forEach(x => {
      if (x.outcome === 'PASS') c.casesPass++; else if (x.outcome === 'QUALIFIED') c.casesQualified++; else if (x.outcome === 'INCONCLUSIVE') c.casesInconclusive++;
      else if (x.outcome === 'FAIL') c.casesFail++; else c.casesNotEvaluated++;

  }

  function buildCompleteMarker(res, verifiedFiles) {

    return { name: PENDING, text: JSON.stringify({
      format: 'LFG-certification-pending', formatVersion: 1, testSetId: res.data.testSetId, batchToken: res.batchToken, batchDirectory: res.batchDir,
      simulatorVersion: res.data.simulatorVersion, canonicalBuildSha256: res.data.canonicalSha256, createdUtc: new Date().toISOString(),
      meaning: note || 'Certification in progress. A directory containing this file is NOT certified. It is removed only after the complete evidence package and COMPLETE.json have been verified; if certification fails or is interrupted it stays, so the directory can never later verify as certified.'
    }, null, 2) };
  }

  /* Shared package inspection. mode:
       'payload'       internal pre-marker check (P3): PENDING required, no terminal marker allowed
       'withPending'   internal post-marker check (P5): PENDING required, exactly one terminal marker
       'final'         public certification: exactly COMPLETE.json, no INCOMPLETE.json, no PENDING
       'storedIncomplete' internal: exactly INCOMPLETE.json, no PENDING (stored, never certified)
     Returns problems (strings) plus hash-bound facts. Never writes. */
  async function inspectEvidence(dCamp, mode) {
    const problems = [];
    const out = { problems, filesVerified: 0, marker: null, man: null, manText: null, summary: null, invRecords: new Map(), arts: [], evidenceExecutionState: null, evidenceScientificStatus: null, evidenceCounts: null, obligations: null, markerParsed: false, markerSchemaValid: false };
    const top = await listEntries(dCamp);
    const lowerTop = top.files.map(lc);
    if (new Set(lowerTop).size !== lowerTop.length) problems.push('Top-level file names collide case-insensitively.');
    // control files: canonical spelling required
    const present = {};
    top.files.forEach(n => {
      const canon = CONTROL_FILES.find(x => lc(x) === lc(n));
      if (canon) { if (n !== canon) problems.push(`Alternate spelling of a control file is not accepted: "${n}" (expected "${canon}").`); present[canon] = (present[canon] || 0) + 1; }
    });
    const has = n => present[n] === 1 && top.files.includes(n);
    const nPresent = n => present[n] || 0;
    const expectedTop = BATCH_FILES.map(lc), controlLower = CONTROL_FILES.map(lc);
    expectedTop.forEach(n => { if (!lowerTop.includes(n)) problems.push(`Required campaign file missing: ${n}.`); });
    top.files.forEach(n => { const k = lc(n); if (!expectedTop.includes(k) && !controlLower.includes(k)) problems.push(`Unexpected file in campaign directory: ${n}.`); });
    BATCH_FILES.forEach(n => { const real = top.files.find(x => lc(x) === lc(n)); if (real !== undefined && real !== n) problems.push(`Required file has a non-canonical spelling: "${real}" (expected "${n}").`); });
    const runsKey = Object.keys(top.dirs).find(n => lc(n) === 'runs');
    if (Object.keys(top.dirs).some(n => lc(n) !== 'runs')) problems.push('Unexpected sub-directory in campaign directory.');
    if (runsKey === undefined) problems.push('runs/ directory missing.');
    const dRuns = runsKey !== undefined ? top.dirs[runsKey] : null;
    const runsListing = dRuns ? await listEntries(dRuns) : { files: [], dirs: {} };
    const runFiles = runsListing.files;
    if (Object.keys(runsListing.dirs).length) problems.push('Unexpected sub-directory inside runs/.');

    // ---- terminal / control state for this mode (evaluated from the listing, never from intent)
    const nC = nPresent('COMPLETE.json'), nI = nPresent('INCOMPLETE.json'), nP = nPresent(PENDING);
    if (mode === 'final') {
      if (nP !== 0) problems.push(`${PENDING} is present: certification was interrupted or failed; this directory is not certified.`);
      if (nI !== 0) problems.push('INCOMPLETE.json is present; only a directory with COMPLETE.json alone can be certified.');
      if (nC !== 1 || !has('COMPLETE.json')) problems.push(`Exactly one COMPLETE.json is required; found ${nC}.`);
    } else if (mode === 'storedIncomplete') {
      if (nP !== 0) problems.push(`${PENDING} is present.`);
      if (nC !== 0) problems.push('COMPLETE.json is present.');
      if (nI !== 1 || !has('INCOMPLETE.json')) problems.push(`Exactly one INCOMPLETE.json is required; found ${nI}.`);
    } else if (mode === 'payload') {
      if (nP !== 1 || !has(PENDING)) problems.push(`${PENDING} must be present during certification.`);
      if (nC + nI !== 0) problems.push('A terminal marker is present before the payload was verified.');
    } else if (mode === 'withPending') {
      if (nP !== 1 || !has(PENDING)) problems.push(`${PENDING} must be present until the marker has been verified.`);
      if (nC + nI !== 1) problems.push(`Exactly one terminal marker required; found ${nC + nI}.`);
    } else problems.push(`Unknown inspection mode ${mode}.`);

    // ---- manifest (hash-bound by COMPLETE.json; must be a plain object)
    let man = null, manText = null;
    try { manText = (await readFileText(dCamp, top.files.find(n => lc(n) === 'manifest.json') || 'manifest.json')).text; }
    catch (e) { problems.push(`manifest.json missing, unreadable or invalid UTF-8 (${e.message}).`); return out; }
    try { man = JSON.parse(manText); } catch (e) { problems.push(`manifest.json is not valid JSON (${e.message}).`); return out; }
    if (!isPlainObject(man)) { problems.push('manifest.json does not contain a JSON object.'); return out; }
    out.man = man; out.manText = manText; out.filesVerified = 1;
    if (man.format !== 'LFG-batch-manifest' || man.formatVersion !== 4 || man.integrityAlgorithm !== 'SHA-256 over exact UTF-8 bytes') problems.push('manifest.json format or integrity schema is unsupported.');
    if (!Array.isArray(man.batchFiles) || man.batchFiles.length !== BATCH_FILES.length || man.batchFiles.some((n, i) => n !== BATCH_FILES[i])) problems.push('manifest.json batchFiles does not match the required package schema.');
    if (!isStr(man.testSetId) || !isStr(man.batchToken) || !(man.phaseId === null || isStr(man.phaseId)) || !isStr(man.simulatorVersion) || !isStr(man.canonicalSha256) || !isStr(man.startUtc) || !isStr(man.endUtc)) problems.push('manifest.json identity fields are missing or of the wrong type.');
    if (!['COMPLETE', 'INCOMPLETE'].includes(man.executionState)) problems.push('manifest.json executionState is invalid.');
    if (!SCI_STATES.includes(man.scientificStatus)) problems.push('manifest.json scientificStatus is invalid.');
    if (!Array.isArray(man.artifacts) || man.artifacts.some(a => !isPlainObject(a) || !isStr(a.file) || !isNonNegInt(a.bytes) || !isStr(a.sha256))) { problems.push('manifest.json artifacts must be an array of {file, bytes, sha256} objects.'); return out; }
    if (!Array.isArray(man.integrityInventory) || man.integrityInventory.some(r => !isPlainObject(r) || !isStr(r.path) || !isNonNegInt(r.bytes) || !isStr(r.sha256) || !HEX64.test(r.sha256))) { problems.push('manifest.json integrityInventory must be an array of {path, bytes (integer), sha256 (lowercase hex)} objects.'); return out; }
    if (!Array.isArray(man.cases) || man.cases.some(c => !isPlainObject(c) || !isStr(c.caseId))) { problems.push('manifest.json cases must be an array of case objects.'); return out; }
    const arts = man.artifacts, inventory = man.integrityInventory;
    out.arts = arts;
    const manNames = arts.map(a => a.file), manLower = manNames.map(lc);
    if (new Set(manLower).size !== manLower.length) problems.push('manifest.json lists the same artifact path more than once (case-insensitive).');
    if (manNames.some(n => !/^runs\/(?!\.{1,2}$)[^/\\]+$/.test(n))) problems.push('manifest.json contains an artifact path outside runs/.');
    const diskLower = runFiles.map(n => 'runs/' + lc(n));
    if (new Set(diskLower).size !== diskLower.length) problems.push('runs/ file names collide case-insensitively.');
    const batchInventoryNames = BATCH_FILES.filter(n => n !== 'manifest.json');
    const invLower = inventory.map(r => lc(r.path));
    if (new Set(invLower).size !== invLower.length) problems.push('integrityInventory contains a duplicate path (case-insensitive).');
    const expectedInventory = manLower.concat(batchInventoryNames.map(lc));
    if (invLower.length !== expectedInventory.length || expectedInventory.some(n => !invLower.includes(n)) || invLower.some(n => !expectedInventory.includes(n))) problems.push('integrityInventory does not cover the exact required evidence path set.');
    inventory.forEach(r => {
      if (!(batchInventoryNames.includes(r.path) || /^runs\/(?!\.{1,2}$)[^/\\]+$/.test(r.path))) problems.push(`integrityInventory contains an invalid or unexpected path: ${r.path}.`);
      out.invRecords.set(lc(r.path), r);
    });
    arts.forEach(a => { const r = out.invRecords.get(lc(a.file)); if (r === undefined || r.bytes !== a.bytes || r.sha256 !== a.sha256 || r.path !== a.file) problems.push(`${a.file}: artifact record differs from integrityInventory.`); });
    const missingRuns = manLower.filter(n => !diskLower.includes(n)), extraRuns = diskLower.filter(n => !manLower.includes(n));
    if (missingRuns.length) problems.push(`Artifacts listed in manifest but missing on disk: ${missingRuns.join(', ')}.`);
    if (extraRuns.length) problems.push(`Files in runs/ not listed in manifest: ${extraRuns.join(', ')}.`);
    const requiredFileCount = BATCH_FILES.length + arts.length;
    if (man.requiredFileCount !== requiredFileCount) problems.push(`manifest.json requiredFileCount ${JSON.stringify(man.requiredFileCount)} != ${requiredFileCount}.`);
    if (inventory.length !== requiredFileCount - 1) problems.push(`integrityInventory count ${inventory.length} != ${requiredFileCount - 1}.`);
    // ---- every inventoried file: actual stored bytes (size + SHA-256)
    const texts = {};
    for (const r of inventory) {
      const isRun = r.path.startsWith('runs/'), name = isRun ? r.path.slice(5) : r.path;
      const dir = isRun ? dRuns : dCamp;
      const actual = (isRun ? runFiles : top.files).find(n => lc(n) === lc(name));
      if (actual === undefined || dir === null) continue;   // reported above as missing
      if (actual !== name) problems.push(`${r.path}: stored name "${actual}" differs in letter case from the inventory.`);
      try {
        const f = await readFileText(dir, actual);
        if (f.size !== r.bytes) problems.push(`${r.path}: size ${f.size} != manifest ${r.bytes}.`);
        else if (sha256Hex(f.text) !== r.sha256) problems.push(`${r.path}: SHA-256 differs from integrityInventory.`);
        else { out.filesVerified++; texts[lc(r.path)] = f.text; }
      } catch (e) { problems.push(`${r.path}: unreadable or invalid UTF-8 (${e.message}).`); }
    }
    // ---- summary.json (hash-bound through the inventory) must agree with the manifest
    if (texts['summary.json'] !== undefined) {
      let s = null;
      try { s = JSON.parse(texts['summary.json']); } catch (e) { problems.push('summary.json is not valid JSON.'); }
      if (s !== null && !isPlainObject(s)) { problems.push('summary.json does not contain a JSON object.'); s = null; }
      if (s !== null) {
        if (!Array.isArray(s.cases) || s.cases.some(c => !isPlainObject(c)) || !isPlainObject(s.counts)) problems.push('summary.json cases/counts are malformed.');
        else {
          out.summary = s;
          ['testSetId', 'phaseId', 'batchToken', 'startUtc', 'endUtc', 'executionState', 'scientificStatus'].forEach(k => { if (s[k] !== man[k]) problems.push(`summary.json ${k} differs from manifest.json.`); });
          if (s.cases.length !== man.cases.length || s.cases.some((c, i) => c.caseId !== man.cases[i].caseId || c.outcome !== man.cases[i].outcome || c.status !== man.cases[i].status || c.executionComplete !== man.cases[i].executionComplete))
            problems.push('summary.json cases differ from manifest.json cases.');
          const derived = countsFromCases(s.cases);
          COUNT_KEYS.forEach(k => { if (s.counts[k] !== derived[k]) problems.push(`summary.json counts.${k} is inconsistent with its cases.`); });
          const derivedSci = classificationFromCases(s.cases);
          if (derivedSci !== s.scientificStatus) problems.push(`summary.json scientificStatus ${s.scientificStatus} differs from the classification derived from its cases (${derivedSci}).`);
          const allComplete = s.cases.length > 0 && s.cases.every(c => c.executionComplete === true);
          if ((s.executionState === 'COMPLETE') !== allComplete) problems.push('summary.json executionState is inconsistent with per-case execution status.');
          out.evidenceCounts = derived;
          out.evidenceExecutionState = man.executionState; out.evidenceScientificStatus = derivedSci;
          out.obligations = checkArtifactObligations({ problems, summary: s, man, texts, runFiles, invRecords: out.invRecords });
        }
      }
    }

    if (out.obligations === null) problems.push('Artifact obligations could not be established from hash-bound summary.json and batch_log.json; completeness cannot be certified.');

    // ---- terminal marker content
    const markerName = (mode === 'final' || has('COMPLETE.json')) ? 'COMPLETE.json' : (has('INCOMPLETE.json') ? 'INCOMPLETE.json' : null);
    if ((mode === 'final' || mode === 'withPending' || mode === 'storedIncomplete') && markerName !== null && top.files.includes(markerName)) {
      out.marker = markerName;
      let mText = null, parsed = false, marker;
      try { mText = (await readFileText(dCamp, markerName)).text; } catch (e) { problems.push(`${markerName} unreadable or invalid UTF-8 (${e.message}).`); }
      if (mText !== null) { try { marker = JSON.parse(mText); parsed = true; } catch (e) { problems.push(`${markerName} is not valid JSON (${e.message}).`); } }
      out.markerParsed = parsed === true;
      if (parsed === true) {
        const before = problems.length;
        if (markerName === 'COMPLETE.json') validateCompleteMarker(marker, { problems, man, manText, arts, out, dirName: dCamp.name, requiredFileCount });
        else validateIncompleteMarker(marker, { problems, man, manText });
        out.markerSchemaValid = problems.length === before;
        if (problems.length === 0) out.filesVerified++;
      }
    }
    return out;
  }

  function validateCompleteMarker(m, ctx) {
    const p = ctx.problems, man = ctx.man, bad = msg => p.push('COMPLETE.json: ' + msg);
    if (!isPlainObject(m)) { bad(`must be a JSON object; found ${m === null ? 'null' : Array.isArray(m) ? 'an array' : typeof m}.`); return; }
    const keys = Object.keys(m);
    const missing = COMPLETE_KEYS.filter(k => !Object.prototype.hasOwnProperty.call(m, k)), extra = keys.filter(k => !COMPLETE_KEYS.includes(k));
    if (missing.length) bad(`missing required field(s): ${missing.join(', ')}.`);
    if (extra.length) bad(`unexpected field(s): ${extra.join(', ')}.`);
    const eq = (k, want, typeOk) => { if (!Object.prototype.hasOwnProperty.call(m, k)) return; if (!typeOk(m[k])) bad(`${k} has the wrong type.`); else if (m[k] !== want) bad(`${k} ${JSON.stringify(m[k])} does not match the evidence (${JSON.stringify(want)}).`); };
    eq('format', 'LFG-batch-completion', isStr);
    eq('formatVersion', 4, isNonNegInt);
    eq('testSetId', man.testSetId, isStr);
    eq('phaseId', man.phaseId, v => v === null || isStr(v));
    eq('batchToken', man.batchToken, isStr);
    eq('batchDirectory', ctx.dirName, isStr);
    if (ctx.dirName !== `${man.testSetId}_${man.batchToken}`) bad(`directory name ${ctx.dirName} does not match the campaign identity ${man.testSetId}_${man.batchToken}.`);
    eq('simulatorVersion', man.simulatorVersion, isStr);
    eq('canonicalBuildSha256', man.canonicalSha256, v => isStr(v) && HEX64.test(v));
    if (man.simulatorVersion !== LFG.SIM_VERSION || man.canonicalSha256 !== LFG.BUILD.canonicalSha256)
      bad(`evidence was produced by simulator ${man.simulatorVersion} (${String(man.canonicalSha256).slice(0, 12)}…), not by this release ${LFG.SIM_VERSION} (${LFG.BUILD.canonicalSha256.slice(0, 12)}…); certify it with the release that produced it.`);
    eq('startUtc', man.startUtc, isStr);
    eq('endUtc', man.endUtc, isStr);
    eq('executionState', 'COMPLETE', v => isStr(v));
    if (man.executionState !== 'COMPLETE') bad('the manifest executionState is not COMPLETE.');
    if (ctx.out.summary === null) bad('summary.json could not be verified, so the classification cannot be confirmed.');
    else {
      if (ctx.out.summary.executionState !== 'COMPLETE') bad('summary.json executionState is not COMPLETE.');
      if (!ctx.out.summary.cases.length || ctx.out.summary.cases.some(c => c.executionComplete !== true)) bad('summary.json records a case that is not execution-complete.');
    }
    if (man.cases.some(c => c.executionComplete !== true)) bad('the manifest records a case that is not execution-complete.');
    eq('scientificStatus', ctx.out.evidenceScientificStatus, v => isStr(v) && SCI_STATES.includes(v));
    if (man.scientificStatus !== ctx.out.evidenceScientificStatus) bad('the manifest scientificStatus differs from the classification derived from summary.json.');
    COUNT_KEYS.forEach(k => eq(k, ctx.out.evidenceCounts ? ctx.out.evidenceCounts[k] : NaN, isNonNegInt));
    if (Object.prototype.hasOwnProperty.call(m, 'casesTotal') && m.casesTotal !== man.cases.length) bad('casesTotal differs from the manifest case list.');
    if (Object.prototype.hasOwnProperty.call(m, 'casesExecutionComplete') && m.casesExecutionComplete !== m.casesTotal) bad('casesExecutionComplete must equal casesTotal for a COMPLETE campaign.');
    const ob = ctx.out.obligations, reqN = ob !== null ? ob.required.length : NaN;
    if (ob === null || ob.allProduced !== true) bad('every case of a COMPLETE campaign must have produced its declared artifacts (obligation records).');
    eq('artifactCount', reqN, isNonNegInt);
    if (ctx.arts.length !== reqN) bad(`the manifest lists ${ctx.arts.length} artifacts; the obligations require ${reqN}.`);
    eq('requiredFileCount', BATCH_FILES.length + reqN, isNonNegInt);
    eq('manifestFile', 'manifest.json', isStr);
    eq('manifestSha256', sha256Hex(ctx.manText), v => isStr(v) && HEX64.test(v));
    const rep = ctx.out.invRecords.get('report.md');
    eq('reportSha256', rep !== undefined ? rep.sha256 : '(no REPORT.md inventory record)', v => isStr(v) && HEX64.test(v));
    eq('reportFile', 'REPORT.md', isStr);
    if (Object.prototype.hasOwnProperty.call(m, 'persistence')) {
      const ps = m.persistence;
      if (!isPlainObject(ps)) bad('persistence must be a JSON object.');
      else {
        const pk = Object.keys(ps), pm = PERSISTENCE_KEYS.filter(k => !Object.prototype.hasOwnProperty.call(ps, k)), px = pk.filter(k => !PERSISTENCE_KEYS.includes(k));
        if (pm.length) bad(`persistence is missing: ${pm.join(', ')}.`);
        if (px.length) bad(`persistence has unexpected field(s): ${px.join(', ')}.`);
        if (ps.state !== 'PERSISTED_AND_VERIFIED') bad('persistence.state is not PERSISTED_AND_VERIFIED.');
        if (ps.method !== PERSIST_METHOD) bad('persistence.method is not the method of this release.');
        if (!isNonNegInt(ps.verifiedFiles) || ps.verifiedFiles !== BATCH_FILES.length + reqN) bad(`persistence.verifiedFiles must equal requiredFileCount (${BATCH_FILES.length + reqN}).`);
      }
    }
  }
  function validateIncompleteMarker(m, ctx) {
    const p = ctx.problems, bad = msg => p.push('INCOMPLETE.json: ' + msg);
    if (!isPlainObject(m)) { bad('must be a JSON object.'); return; }
    if (m.format !== 'LFG-batch-incomplete') bad('format is not LFG-batch-incomplete.');
    if (m.batchToken !== ctx.man.batchToken || m.testSetId !== ctx.man.testSetId) bad('campaign identity differs from the manifest.');
    if (m.manifestSha256 !== sha256Hex(ctx.manText)) bad('manifestSha256 does not match manifest.json.');
  }

  /* INTERNAL pre-marker payload check (P3). Never exported, never a certification. */
  async function verifyEvidencePayloadBeforeMarker(dCamp, expected) {
    let r;
    try { r = await inspectEvidence(dCamp, 'payload'); } catch (e) { return { payloadVerified: false, problems: [`payload inspection failed: ${e.message || String(e)}`], filesVerified: 0 }; }
    const problems = r.problems;
    if (r.manText !== null) {
      const genMan = expected.batchFiles.find(f => f.name === 'manifest.json').text;
      if (r.manText !== genMan) problems.push('Stored manifest.json differs from the generated manifest.');
      if (sha256Hex(r.manText) !== expected.manifestSha256) problems.push('Stored manifest.json SHA-256 differs from the hash the marker will record.');
      const rep = r.invRecords.get('report.md');
      if (rep === undefined || rep.sha256 !== expected.reportSha256) problems.push('REPORT.md inventory hash differs from the generated report.');
      if (r.arts.length !== expected.runFiles.length) problems.push(`manifest.json lists ${r.arts.length} artifacts; the result generated ${expected.runFiles.length}.`);
      if (r.man !== null && (r.man.executionState !== expected.executionState || r.man.batchToken !== expected.batchToken)) problems.push('manifest.json execution state or batch token differs from the result.');
      if (r.evidenceScientificStatus !== null && r.evidenceScientificStatus !== expected.scientificStatus) problems.push('Derived classification differs from the result.');
    }
    return { payloadVerified: problems.length === 0, problems, filesVerified: r.filesVerified };
  }

  /* PUBLIC final certification. Always requires the final terminal state; accepts no options. Read-only; fails closed. */
  async function verifyEvidenceDirectory(dCamp) {
    const name = (dCamp && typeof dCamp.name === 'string') ? dCamp.name : null;
    const fail = problems => ({ verified: false, certified: false, problems, filesVerified: 0, marker: null, executionState: null, scientificStatus: null, classificationSource: null, batchDirectory: name });
    if (arguments.length > 1 && arguments[1] !== undefined && arguments[1] !== null) {
      const o = arguments[1];
      if (typeof o !== 'object' || Object.keys(o).length) return fail(['verifyEvidenceDirectory accepts no options: it always requires the final certified state (exactly COMPLETE.json, no INCOMPLETE.json, no CERTIFICATION_PENDING.json).']);
    }
    let r;
    try { r = await inspectEvidence(dCamp, 'final'); } catch (e) { return fail([`Evidence verification failed closed: ${e.message || String(e)}`]); }
    const markerExists = r.marker === 'COMPLETE.json';
    const ok = markerExists === true && r.markerParsed === true && r.markerSchemaValid === true && r.problems.length === 0;
    return {
      verified: ok, certified: ok, problems: ok ? [] : (r.problems.length ? r.problems : ['COMPLETE.json missing.']), filesVerified: r.filesVerified, marker: r.marker,
      executionState: r.evidenceExecutionState, scientificStatus: r.evidenceScientificStatus,
      classificationSource: 'manifest.json + summary.json (hash-bound); never taken from COMPLETE.json', batchDirectory: name
    };
  }

  /* Terminal-marker state machine (v1.1.7). persistToDirectory() resolves certified:true only after P7.
       P0 PREFLIGHT        result shape, unique names (case-insensitive), no control file in the set, target directory absent.
       P1 PENDING_WRITTEN  new directory; CERTIFICATION_PENDING.json written and read back FIRST.
       P2 WRITTEN          every run artifact and batch file written and read back (bytes + SHA-256); never overwrites.
       P3 PAYLOAD_VERIFIED internal verifyEvidencePayloadBeforeMarker(): full package + generated-result equality; no marker.
       P4 MARKER_WRITTEN   COMPLETE.json (execution COMPLETE) or INCOMPLETE.json written and read back.
       P5 MARKER_VERIFIED  full package + strict marker schema re-verified with PENDING still present.
       P6 PENDING_REMOVED  CERTIFICATION_PENDING.json removed and its absence confirmed from the listing.
       P7 CERTIFIED        public verifyEvidenceDirectory() passes on the final directory -> {certified: true}.
                           (INCOMPLETE campaigns: stored package re-verified -> {stored: true, certified: false}.)
     Any failure after P1 -> FAILED:
       F0 ensure CERTIFICATION_PENDING.json is present (re-create it if P6 had removed it);
       F1 remove COMPLETE.json / INCOMPLETE.json written by this operation;
       F2 write INCOMPLETE.json (persistence.state PERSISTENCE_FAILED, exact reason) and read it back;
       F3 establish the resulting state from the listing; throw with certified:false.
     HARD PERSISTENCE ERROR when the pending sentinel cannot be removed (P6), when COMPLETE.json cannot be removed, or when
     no safe failure state (PENDING present or COMPLETE absent) can be established. A directory that keeps
     CERTIFICATION_PENDING.json is permanently uncertifiable; recertification requires a new controlled campaign run. */
  async function topControl(dCamp) {
    const out = [];
    for await (const [name, ent] of dCamp.entries()) if (ent.kind === 'file' && CONTROL_FILES.some(m => lc(m) === lc(name))) out.push(name);
    return out;
  }
  async function enterFailedState(dCamp, res, err, flags) {
    const steps = [];
    let hard = flags.pendingRemovalFailed === true ? 'CERTIFICATION_PENDING.json could not be removed' : null, listingFailed = false;
    // F0: the pending sentinel must exist on every failed directory
    try {
      const now = await topControl(dCamp);
      if (!now.some(n => lc(n) === lc(PENDING))) {
        try { const s = buildPendingSentinel(res, `Certification FAILED (${err.message}). This directory is permanently NOT certified.`); await writeAndCheck(dCamp, s.name, s.text); steps.push('re-created ' + PENDING); }
        catch (e) { steps.push(`${PENDING} could not be re-created (${e.message})`); }
      }
    } catch (e) { listingFailed = true; steps.push(`listing failed (${e.message})`); }
    // F1: remove terminal markers written by this operation
    let present = [];
    try { present = (await topControl(dCamp)).filter(n => lc(n) !== lc(PENDING)); } catch (e) { listingFailed = true; }
    for (const n of present) {
      try {
        if (typeof dCamp.removeEntry !== 'function') throw new Error('removeEntry is not supported by this directory handle');
        await dCamp.removeEntry(n); steps.push(`removed ${n}`);
      } catch (e) { steps.push(`${n} could not be removed (${e.message})`); if (lc(n) === 'complete.json') hard = hard || `COMPLETE.json could not be removed (${e.message})`; }
    }
    // F2: failure record
    let remaining = null;
    try { remaining = await topControl(dCamp); } catch (e) { listingFailed = true; }
    if (remaining !== null && !remaining.some(n => lc(n) === 'incomplete.json')) {
      try { const fail = buildIncompleteMarker(res, { state: 'PERSISTENCE_FAILED', error: err.message, failedStage: flags.stage, removedMarkers: present.slice() }); await writeAndCheck(dCamp, fail.name, fail.text); steps.push(`wrote ${fail.name}`); }
      catch (e2) { steps.push(`failure record could not be written (${e2.message})`); }
    }
    // F3: resulting state, from storage
    let after = null;
    try { after = await topControl(dCamp); } catch (e) { listingFailed = true; }
    const completeLeft = after === null ? true : after.some(n => lc(n) === 'complete.json');
    const pendingPresent = after !== null && after.some(n => n === PENDING);
    let incompleteOk = false;
    if (after !== null && after.filter(n => lc(n) === 'incomplete.json').length === 1) {
      try { const m = JSON.parse((await readFileText(dCamp, 'INCOMPLETE.json')).text); incompleteOk = isPlainObject(m) && m.format === 'LFG-batch-incomplete' && isPlainObject(m.persistence) && m.persistence.state === 'PERSISTENCE_FAILED'; } catch (e) { incompleteOk = false; }
    }
    const safe = pendingPresent === true || completeLeft === false;
    if (completeLeft === true) hard = hard || 'COMPLETE.json is still present after recovery';
    if (listingFailed) hard = hard || 'the directory listing could not be read during recovery';
    err.certified = false; err.dirCreated = true; err.failureSteps = steps; err.pendingSentinelPresent = pendingPresent; err.safeFailureState = safe;
    if (hard !== null || safe !== true) {
      err.hardPersistenceError = true; err.terminalState = 'UNKNOWN';
      err.message = `HARD PERSISTENCE ERROR: ${hard || 'no safe failure state could be established'}. The directory Test_Results/${res.batchDir} is NOT certified and must not be used as evidence${pendingPresent ? ' (CERTIFICATION_PENDING.json keeps it permanently uncertifiable)' : ' (WARNING: the pending sentinel could not be re-created; do not use this directory)'}. Original failure: ${err.message}`;
    } else {
      err.terminalState = incompleteOk ? 'INCOMPLETE' : 'NONE';
      err.failureRecord = incompleteOk ? 'INCOMPLETE.json' : null;
      err.message += ' (no COMPLETE.json exists; ' + (incompleteOk ? 'INCOMPLETE.json failure record written' : 'the failure record could not be written')
        + (pendingPresent ? '; CERTIFICATION_PENDING.json retained, so the directory can never certify)' : '; CERTIFICATION_PENDING.json could not be written, but without COMPLETE.json the directory cannot certify)');
    }
    return err;
  }

  async function persistToDirectory(dTr, res) {
    if (!res || !res.batchDir || !Array.isArray(res.runFiles) || !Array.isArray(res.batchFiles)) throw new Error('Not a campaign result.');
    if (res.persisted === true) throw new Error('This campaign result was already persisted.');
    const names = res.runFiles.map(f => 'runs/' + lc(f.name)).concat(res.batchFiles.map(f => lc(f.name)));
    if (new Set(names).size !== names.length) { const e = new Error('Duplicate artifact file names (case-insensitive) in the evidence set; nothing was written.'); e.dirCreated = false; e.certified = false; throw e; }
    if (res.batchFiles.some(f => CONTROL_FILES.some(c => lc(c) === lc(f.name)))) { const e = new Error('Evidence set already contains a control/terminal file; nothing was written.'); e.dirCreated = false; e.certified = false; throw e; }
    let exists = false;
    try { await dTr.getDirectoryHandle(res.batchDir); exists = true; } catch (e) { exists = false; }
    if (exists) { const e = new Error(`Collision detected: target directory Test_Results/${res.batchDir} already exists. Nothing was written; existing evidence is untouched.`); e.dirCreated = false; e.terminalState = 'NONE'; e.certified = false; throw e; }
    const dCamp = await dTr.getDirectoryHandle(res.batchDir, { create: true });
    let stage = 'P0_DIR_CREATED';
    const flags = { pendingRemovalFailed: false };
    try {
      const pend = buildPendingSentinel(res);
      await writeAndCheck(dCamp, pend.name, pend.text);
      stage = 'P1_PENDING_WRITTEN';
      const dRuns = await dCamp.getDirectoryHandle('runs', { create: true });
      for (const rf of res.runFiles) await writeAndCheck(dRuns, rf.name, rf.text, rf.bytes, rf.sha256);
      for (const bf of res.batchFiles) await writeAndCheck(dCamp, bf.name, bf.text);
      stage = 'P2_WRITTEN';
      const v3 = await verifyEvidencePayloadBeforeMarker(dCamp, res);
      if (v3.payloadVerified !== true) throw new Error('Pre-marker payload verification failed: ' + v3.problems.join(' '));
      stage = 'P3_PAYLOAD_VERIFIED';
      const isComplete = res.executionState === 'COMPLETE';
      const marker = isComplete ? buildCompleteMarker(res, v3.filesVerified)
        : buildIncompleteMarker(res, { state: 'PERSISTED_AND_VERIFIED', method: PERSIST_METHOD, verifiedFiles: v3.filesVerified });
      await writeAndCheck(dCamp, marker.name, marker.text);
      stage = 'P4_MARKER_WRITTEN';
      const v5 = await inspectEvidence(dCamp, 'withPending');
      if (v5.problems.length !== 0 || v5.marker !== marker.name) throw new Error('Marker verification failed: ' + (v5.problems.join(' ') || `found ${v5.marker}`));
      stage = 'P5_MARKER_VERIFIED';
      try {
        if (typeof dCamp.removeEntry !== 'function') throw new Error('removeEntry is not supported by this directory handle');
        await dCamp.removeEntry(PENDING);
      } catch (e) { flags.pendingRemovalFailed = true; throw new Error(`${PENDING} could not be removed (${e.message})`); }
      if ((await topControl(dCamp)).some(n => lc(n) === lc(PENDING))) { flags.pendingRemovalFailed = true; throw new Error(`${PENDING} is still listed after removal.`); }
      stage = 'P6_PENDING_REMOVED';
      let filesVerified;
      if (isComplete) {
        const v7 = await verifyEvidenceDirectory(dCamp);
        if (v7.verified !== true) throw new Error('Final public verification failed: ' + v7.problems.join(' '));
        filesVerified = v7.filesVerified;
        stage = 'P7_CERTIFIED';
      } else {
        const v7 = await inspectEvidence(dCamp, 'storedIncomplete');
        if (v7.problems.length !== 0) throw new Error('Stored INCOMPLETE package verification failed: ' + v7.problems.join(' '));
        filesVerified = v7.filesVerified;
        stage = 'P7_STORED_INCOMPLETE';
      }
      res.persisted = true; res.persistence = 'PERSISTED_AND_VERIFIED'; res.markerName = marker.name; res.certified = isComplete;
      return { verified: isComplete, certified: isComplete, stored: true, terminalState: isComplete ? 'COMPLETE' : 'INCOMPLETE', marker: marker.name, filesVerified, dir: res.batchDir, executionState: res.executionState, scientificStatus: res.scientificStatus };
    } catch (e0) {
      res.persisted = false; res.persistence = 'PERSISTENCE_FAILED'; res.markerName = null; res.certified = false;
      const e = new Error(`[failed after ${stage}] ` + (e0 && e0.message ? e0.message : String(e0))); e.cause = e0; e.failedStage = stage;
      const err = await enterFailedState(dCamp, res, e, { pendingRemovalFailed: flags.pendingRemovalFailed, stage });
      res.persistenceError = err.message; res.terminalState = err.terminalState;
      throw err;
    }
  }

  /* ---------- UI ---------- */
  function ensureBuilt() {
    if (document.getElementById('tsModal')) return;
    const modal = document.createElement('div');
    modal.id = 'tsModal'; modal.className = 'cdm'; modal.hidden = true;
    modal.innerHTML = `
      <div class="cdbox" style="max-width:820px;height:auto;max-height:90vh;">
        <div class="cdhead"><div class="cdh1">
          <span style="font-weight:700;font-size:14px;">Run Simulation Campaign (LFGBatch Autopilot)</span><span class="sp"></span>
          <button id="tsClose" class="cdbtn" style="background:#fff;">Close</button>
        </div></div>
        <div class="cdcol" style="padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <label style="font-weight:600;">Select Campaign / Test Set:</label>
            <select id="tsSelect" style="flex:1;min-width:240px;"></select>
            <button id="tsBrowse" class="cdbtn">Load Campaign / Test Set…</button>
          </div>
          <div id="tsPreCheck" style="background:#f8f9fa;border:1px solid #d0d4d9;border-radius:6px;padding:10px;font-size:12.5px;">
            <div id="tsInfo" style="margin-bottom:6px;font-weight:600;">No campaign selected.</div>
            <div id="tsDetails" style="color:#555;">Select a campaign to validate cases, models, and presets before running.</div>
          </div>
          <div id="tsProgressSection" style="display:none;border-top:1px dashed #d0d4d9;padding-top:10px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px;font-weight:600;"><span id="tsProgressCase">Case 0 of 0</span><span id="tsProgressStatus">Idle</span></div>
            <div style="background:#e5e7eb;border-radius:4px;height:12px;overflow:hidden;margin-bottom:8px;"><div id="tsProgressBar" style="background:#1769D2;width:0%;height:100%;transition:width 0.2s;"></div></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#5b6470;">Execution Log</div>
            <pre id="tsLogBox" style="background:#1e1e1e;color:#d4d4d4;font-family:monospace;font-size:11.5px;padding:8px;border-radius:4px;height:140px;overflow-y:auto;margin:0;white-space:pre-wrap;"></pre>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
            <button id="tsViewReport" class="cdbtn" style="display:none;">View Campaign Report</button><span class="sp"></span>
            <button id="tsStartBtn" class="primary" style="min-width:140px;" disabled>Run Campaign</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(modal);
    const reportModal = document.createElement('div');
    reportModal.id = 'tsReportModal'; reportModal.className = 'cdm'; reportModal.hidden = true;
    reportModal.innerHTML = `
      <div class="cdbox" style="max-width:960px;height:min(85vh,780px);">
        <div class="cdhead"><div class="cdh1">
          <span style="font-weight:700;font-size:14px;" id="tsReportTitle">Simulation Campaign Report</span><span class="sp"></span>
          <select id="tsStored" title="Open a stored campaign from Test_Results in the linked folder (verified on open)" style="max-width:340px;display:none;"></select>
          <button id="tsReportClose" class="cdbtn" style="background:#fff;">Close</button>
        </div></div>
        <div id="tsVerify" style="padding:8px 16px 0;font-size:12.5px;"></div>
        <div id="tsReportContent" style="padding:16px;overflow-y:auto;font-size:13px;flex:1;white-space:pre-wrap;font-family:system-ui,-apple-system,sans-serif;"></div>
      </div>`;
    document.body.appendChild(reportModal);
    document.getElementById('tsClose').onclick = () => { modal.hidden = true; };
    document.getElementById('tsReportClose').onclick = () => { reportModal.hidden = true; };
    document.getElementById('tsSelect').onchange = e => {
      const val = e.target.value;
      if (val && typeof LFGE !== 'undefined') { const item = LFGE.list('Test_Sets').find(x => x.id === val); if (item) setTestSet(item.obj); }
    };
    document.getElementById('tsBrowse').onclick = () => { const fi = document.getElementById('fileImpTestSet'); if (fi) fi.click(); };
    const fi = document.getElementById('fileImpTestSet');
    if (fi) fi.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => { try { setTestSet(JSON.parse(evt.target.result)); } catch (err) { alert('Could not parse testset JSON: ' + err.message); } };
      reader.readAsText(file); e.target.value = '';
    };
    document.getElementById('tsStartBtn').onclick = () => { if (!activeTestSet) { alert('No test set selected.'); return; } runActiveBatch(); };
    document.getElementById('tsViewReport').onclick = () => { openReportModal(); };
    document.getElementById('tsStored').onchange = e => { if (e.target.value) showStoredReport(e.target.value); };
  }

  function setTestSet(obj) {
    ensureBuilt();
    activeTestSet = obj;
    const v = validate(obj);
    const pre = document.getElementById('tsPreCheck'), info = document.getElementById('tsInfo'), det = document.getElementById('tsDetails'), btn = document.getElementById('tsStartBtn');
    if (!v.valid) {
      pre.style.background = '#fde8e8'; pre.style.borderColor = '#e39a95';
      info.textContent = 'Validation FAILED: ' + v.error; det.textContent = 'Please correct the test-set definition before running.'; btn.disabled = true;
    } else {
      pre.style.background = '#eef7ee'; pre.style.borderColor = '#8ed68e';
      info.textContent = `Validation PASSED: ${obj.testSetId} (${v.casesCount} case${v.casesCount === 1 ? '' : 's'})`;
      det.textContent = `${obj.title || ''} — Purpose: ${obj.purpose || 'None stated'}`; btn.disabled = false;
    }
  }

  function openModal() {
    ensureBuilt();
    const sel = document.getElementById('tsSelect');
    sel.innerHTML = '<option value="">-- Choose a campaign / test set --</option>';
    if (typeof LFGE !== 'undefined') {
      const sets = LFGE.list('Test_Sets');
      sets.forEach(ts => { const opt = document.createElement('option'); opt.value = ts.id; opt.textContent = `${ts.id}: ${(ts.obj && ts.obj.title) || ts.folder}`; sel.appendChild(opt); });
      if (sets.length > 0 && !activeTestSet) { sel.value = sets[0].id; setTestSet(sets[0].obj); }
    }
    document.getElementById('tsModal').hidden = false;
  }

  async function storedCampaignDirs() {
    if (typeof LFGE === 'undefined' || !LFGE.hasFolder() || !LFGE.testResultsDir) return [];
    const dTr = await LFGE.testResultsDir(); if (!dTr) return [];
    const out = []; for await (const [name, ent] of dTr.entries()) if (ent.kind === 'directory' && !/^_/.test(name)) out.push(name);
    return out.sort();
  }
  async function showStoredReport(dirName) {
    ensureBuilt();
    const box = document.getElementById('tsVerify'), content = document.getElementById('tsReportContent');
    box.textContent = 'Verifying stored campaign…'; content.textContent = '';
    try {
      const dTr = await LFGE.testResultsDir(), dCamp = await dTr.getDirectoryHandle(dirName);
      const v = await verifyEvidenceDirectory(dCamp);
      box.innerHTML = '';
      const p = document.createElement('div');
      p.style.cssText = 'padding:8px;border-radius:6px;border:1px solid ' + (v.verified ? '#8ed68e;background:#eef7ee' : '#e39a95;background:#fde8e8');
      p.textContent = v.verified ? `Stored evidence CERTIFIED (${v.filesVerified} files; marker ${v.marker}; execution ${v.executionState}; scientific ${v.scientificStatus}, from the hash-bound manifest and summary).` : `Stored evidence NOT certified: ${v.problems.join(' ')}`;
      box.appendChild(p);
      document.getElementById('tsReportTitle').textContent = `Simulation Campaign Report (stored): ${dirName}`;
      try { const fh = await dCamp.getFileHandle('REPORT.md'); content.textContent = await (await fh.getFile()).text(); } catch (e) { content.textContent = 'REPORT.md not found in this directory.'; }
    } catch (e) { box.textContent = 'Could not open stored campaign: ' + e.message; }
  }
  async function openReportModal() {
    ensureBuilt();
    const stored = await storedCampaignDirs().catch(() => []);
    const sel = document.getElementById('tsStored');
    if (stored.length) {
      sel.innerHTML = '<option value="">-- Stored campaigns (Test_Results) --</option>' + stored.map(n => `<option value="${n}">${n}</option>`).join('');
      sel.style.display = '';
    } else sel.style.display = 'none';
    document.getElementById('tsVerify').textContent = '';
    if (lastBatchResult) {
      const r = lastBatchResult;
      document.getElementById('tsReportTitle').textContent = `Simulation Campaign Report: ${r.data.testSetId} (${r.batchToken})`;
      document.getElementById('tsVerify').textContent = `In-memory result. Persistence: ${r.persistence}${r.markerName ? ' (' + r.markerName + ')' : ''}.`;
      document.getElementById('tsReportContent').textContent = r.reportMd;
      document.getElementById('tsReportModal').hidden = false;
      return;
    }
    if (stored.length) {
      document.getElementById('tsReportTitle').textContent = 'Simulation Campaign Report';
      document.getElementById('tsReportContent').textContent = 'Choose a stored campaign from the list above.';
      document.getElementById('tsReportModal').hidden = false;
      return;
    }
    alert('No campaign result available. Run a campaign first, or link the 04_Orbital_Derivation folder to open a stored campaign.');
  }

  async function runActiveBatch() {
    if (!activeTestSet || batchRunning) return;
    batchRunning = true;
    ensureBuilt();
    const btn = document.getElementById('tsStartBtn'), pSec = document.getElementById('tsProgressSection'), pCase = document.getElementById('tsProgressCase');
    const pStatus = document.getElementById('tsProgressStatus'), pBar = document.getElementById('tsProgressBar'), logBox = document.getElementById('tsLogBox'), vrBtn = document.getElementById('tsViewReport');
    btn.disabled = true; vrBtn.style.display = 'none'; pSec.style.display = 'block'; logBox.textContent = '';
    const appendLog = entry => { logBox.textContent += `[${entry.timestamp.slice(11, 19)}] ${entry.type}: ${JSON.stringify(entry.detail)}\n`; logBox.scrollTop = logBox.scrollHeight; };
    let res = null;
    try {
      const total = activeTestSet.cases.length;
      res = executeBatch(activeTestSet, {
        onLog: appendLog,
        onProgress: p => { pCase.textContent = `Case ${p.caseIndex} of ${total}: ${p.caseId}`; pStatus.textContent = p.status; pBar.style.width = Math.round((p.caseIndex / total) * 100) + '%'; }
      });
      lastBatchResult = res;
    } catch (e) {
      appendLog({ timestamp: new Date().toISOString(), type: 'FATAL_ERROR', detail: e.message });
      alert('Campaign could not be executed: ' + e.message);
      batchRunning = false; btn.disabled = false; return;
    }
    vrBtn.style.display = 'inline-block';
    const head = `Campaign ${res.data.testSetId} (batch ${res.batchToken})\nExecution: ${res.executionState} · Scientific classification: ${res.scientificStatus}`;
    try {
      if (typeof LFGE !== 'undefined' && LFGE.hasFolder()) {
        const pv = await LFGE.writeBatchResults(res);
        if (pv.certified) {
          appendLog({ timestamp: new Date().toISOString(), type: 'EVIDENCE_CERTIFIED', detail: `Test_Results/${res.batchDir} (${pv.filesVerified} files, marker ${pv.marker})` });
          pStatus.textContent = `Execution ${res.executionState}; evidence certified (${pv.marker})`;
          updateUiStatus(`Campaign ${res.executionState.toLowerCase()}: ${res.batchDir} (${pv.marker})`, 'done');
          alert(`${head}\nEvidence certified: Test_Results/${res.batchDir}\nTerminal marker: ${pv.marker} (${pv.filesVerified} files read back and checked).`);
        } else {
          appendLog({ timestamp: new Date().toISOString(), type: 'EVIDENCE_PERSISTED_NOT_CERTIFIED', detail: `Test_Results/${res.batchDir} (${pv.filesVerified} files, marker ${pv.marker})` });
          pStatus.textContent = `Execution ${res.executionState}; INCOMPLETE evidence stored, not certified`;
          updateUiStatus(`Campaign incomplete: ${res.batchDir} (not certified)`, 'bad');
          alert(`${head}\nIncomplete evidence was stored: Test_Results/${res.batchDir}\nTerminal marker: ${pv.marker}. It is not a certified COMPLETE campaign.`);
        }
      } else {
        appendLog({ timestamp: new Date().toISOString(), type: 'NOT_PERSISTED', detail: 'Folder not linked: results exist in memory only; no marker was written.' });
        pStatus.textContent = `Execution ${res.executionState}; NOT persisted (in memory only)`;
        updateUiStatus('Campaign executed in memory only (folder not linked)', 'bad');
        alert(`${head}\nWARNING: No folder linked. Results exist in memory only and were NOT persisted; no COMPLETE.json was produced.\nLink the 04_Orbital_Derivation folder and run the campaign again to create evidence.`);
      }
    } catch (e) {
      appendLog({ timestamp: new Date().toISOString(), type: 'PERSISTENCE_FAILED', detail: e.message });
      pStatus.textContent = 'Evidence persistence FAILED';
      updateUiStatus('Campaign evidence persistence failed', 'bad');
      const tail = !e.dirCreated ? 'Nothing was written.'
        : e.hardPersistenceError ? 'HARD ERROR: the directory is NOT certified and must not be used as evidence; inspect it manually.'
        : (e.terminalState === 'INCOMPLETE' ? 'No COMPLETE.json exists; an INCOMPLETE.json failure record was written.' : 'No COMPLETE.json exists; the failure record could not be written.')
          + (e.pendingSentinelPresent ? ' CERTIFICATION_PENDING.json was kept, so the directory can never certify.' : ' The directory is not evidence.');
      alert(`${head}\nEvidence persistence FAILED: ${e.message}\n${tail}`);
    } finally {
      batchRunning = false; btn.disabled = false;
    }
  }

  /* Headless execution: in-memory only. The result carries persistence "NOT_PERSISTED" and NO terminal marker.
     To create evidence from a headless run, call persistToDirectory(testResultsDirHandle, result) with a real directory handle. */
  function runBatchHeadless(tsJsonOrObj) {
    const ts = typeof tsJsonOrObj === 'string' ? JSON.parse(tsJsonOrObj) : tsJsonOrObj;
    return executeBatch(ts);
  }

  return {
    validate, executeBatch, generateReport, runBatchHeadless, persistToDirectory, verifyEvidenceDirectory,
    caseLocatorOf, utf8ByteLength, sha256Hex, ensureBuilt, openModal, openReportModal, showStoredReport, setTestSet, runActiveBatch,
    getLastResult: () => lastBatchResult
  };
})();

window.LFGBatch = LFGBatch;
if (typeof LFG !== 'undefined') LFG.Batch = LFGBatch;
window.setStatus = function (txt, kind) { if (window.LFGUI && typeof window.LFGUI.setStatus === 'function') window.LFGUI.setStatus(txt, kind); };
</script>
